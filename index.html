<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS 70 Soru Maratonu (Tarih - Coğrafya - Güncel)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-cikmis { background: #dc2626; color: #fee2e2; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
    .cat-guncel { background: #d97706; color: #fef3c7; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS Genel Kültür Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 30 Coğrafya + 10 Güncel (70 Soru - Sıfır Tekrar)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/70</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-70-maraton-guncel-v3";

const questions = [
  // ==================== TARİH (30 SORU) ====================
  // İslamiyet Öncesi (4)
  { q: "Eski Türklerde hükümdarın tahta çıkış hakkının hanedanın tüm erkek üyelerine ait olması hangi anlayışın sonucudur?", options: ["Ortak mülkiyet ve veraset anlayışı", "Feodalizm", "Monarşi", "Oligarşi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İslamiyet öncesinde savaşta kahramanlık gösteren yiğitlere verilen 'Alp' unvanı hangi değerin göstergesidir?", options: ["Cesaret ve askeri yetenek", "Dini liderlik", "Zenginlik", "Soy soyluluğu"], answer: 0, tag: "Tarih" },
  { q: "Türklerin göçebe yaşam tarzını benimsemesi sonucunda aşağıdakilerden hangisi gelişme GÖSTERMEMİŞTİR?", options: ["Mimari ve taş yapılar", "Demircilik", "At koşum takımları", "Dokumacılık"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İslamiyet öncesi Türk devletlerinde yazının geç kullanılmasının temel sebebi nedir?", options: ["Göçebe ve konargöçer yaşam tarzı", "Ticaretin olmaması", "Dilin yetersizliği", "Din adamlarının baskısı"], answer: 0, tag: "Tarih" },

  // İlk Türk-İslam (4)
  { q: "Büyük Selçuklu Devleti'nde Sultan Alparslan döneminde vezirlik yapan ve Nizamiye Medreselerini kuran devlet adamı kimdir?", options: ["Nizamülmülk", "Kunduri", "İsferayini", "Ömer Hayyam"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Karahanlılar Devleti'nin resmi yazışmalarında ve edebiyatında Türkçe kullanması neyin göstergesidir?", options: ["Milli kültürlerini koruduklarının", "İslamiyeti benimsemediklerinin", "Arap kültürünü taklit ettiklerinin", "Göçebe kaldıklarının"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Anadolu Selçuklularında gayrimüslimlerden alınan askeri muafiyet ve haraç gelirlerinin toplandığı hazineye ne denirdi?", options: ["Cizye ve Haraç Sandığı", "İrad-ı Cedit", "Mukataa Hazinesi", "Beytülmal"], answer: 3, tag: "Tarih" },
  { q: "İlk Türk-İslam devletlerinde hükümdarın cuma namazlarında adının imam tarafından zikredilmesine ne denir?", options: ["Hutbe Okutmak", "Hilat Giymek", "Nevbet Vurdurmak", "Tuğ Taşımak"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Osmanlı Siyasi & Kültür (10)
  { q: "Osmanlı Devleti'nde ilk gümüş parayı (akçe) bastıran padişah hangisidir?", options: ["Orhan Bey", "Osman Bey", "I. Murad", "Yıldırım Bayezid"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde 'Ülke hükümdar ve oğullarınındır' anlayışını ilk getiren padişah kimdir?", options: ["I. Murad", "Osman Bey", "Orhan Bey", "Fatih Sultan Mehmet"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "II. Mehmet (Fatih) döneminde çıkarılan ve kardeş katline cevaz veren ilk yazılı kanunname hangisidir?", options: ["Kanunname-i Âl-i Osman", "Mecelle", "Kanun-ı Esasi", "Fatih Adaletnamesi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Yavuz Sultan Selim'in 1516 yılında Memlüklerle yaptığı ve Suriye, Filistin topraklarını Osmanlı'ya katan zafer hangisidir?", options: ["Mercidabık Savaşı", "Ridaniye Savaşı", "Çaldıran Savaşı", "Turnadağ Savaşı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde yabancı devletlere verilen ticari ve hukuki ayrıcalıklara ne ad verilir?", options: ["Kapitülasyon (İmtiyaz)", "İltizam", "Berat", "Müsadere"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Tımar sisteminin bozulmasıyla eyaletlerde asayişi sağlamak amacıyla toplanan derme çatma askerlere ne ad verilirdi?", options: ["Sekban ve Sarıca", "Yeniçeri", "Cebelü", "Bostancı"], answer: 0, tag: "Tarih" },
  { q: "Lale Devri'nde Paris'e elçi olarak gönderilen ve ünlü Sefaretname'yi yazan Osmanlı diplomatı kimdir?", options: ["Yirmisekiz Çelebi Mehmed", "Ebubekir Ratıp Efendi", "Rami Mehmed Paşa", "Halet Efendi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde 'Vaka-i Hayriye' olarak adlandırılan olayla hangi askeri ocak kaldırılmıştır?", options: ["Yeniçeri Ocağı", "Sipahi Ocağı", "Leventler", "Humbaracılar"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "II. Mahmut döneminde köy ve mahallelerde muhtarlık teşkilatının kurulmasının temel amacı nedir?", options: ["Merkezi otoriteyi taşrada güçlendirmek", "Vergileri kaldırmak", "Askerliği bitirmek", "Belediyeleri kapatmak"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde ilk kez parlamentolu ve anayasal düzene geçiş hangi ferman/anayasa ile olmuştur?", options: ["1876 Kanun-ı Esasi (I. Meşrutiyet)", "Tanzimat Fermanı", "Islahat Fermanı", "Sened-i İttifak"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Milli Mücadele & İnkılap (9)
  { q: "Mustafa Kemal Paşa'nın 1905 yılında ilk görev yeri olan Şam'da kurduğu gizli cemiyet hangisidir?", options: ["Vatan ve Hürriyet Cemiyeti", "İttihat ve Terakki", "Müdafaa-i Hukuk", "Karakol Cemiyeti"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Çanakkale Cephesi'nde Mustafa Kemal'in 'Ben size taarruzu emretmiyorum, ölmeyi emrediyorum' dediği tepe hangisidir?", options: ["Conkbayırı", "Kilitbahir", "Seddülbahir", "Arıburnu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Amasya Genelgesi'nde ilk kez bahsedilen ve Milli Mücadele'yi yönetecek olan kurul hangisidir?", options: ["Temsil Heyeti (Heyet-i Temsiliye)", "İcra Vekilleri Heyeti", "Kuvayımilliye", "Encümen-i Daniş"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Erzurum Kongresi'nin toplanmasında doğrudan etkili olan iki cemiyet hangisidir?", options: ["Doğu Anadolu Müdafaa-i Hukuk ve Trabzon Muhafaza-i Hukuk", "Kilikyalılar ve Redd-i İlhak", "Trakya-Paşaeli ve Karakol", "Milli Kongre ve Gizli Karakol"], answer: 0, tag: "Tarih" },
  { q: "I. TBMM'nin açılış konuşmasını meclisin en yaşlı üyesi sıfatıyla yapan Sinop Mebusu kimdir?", options: ["Şerif Bey", "Celal Bayar", "Ali Fethi Okyar", "Diyap Ağa"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Gümrü Antlaşması ile TBMM'yi ve Misak-ı Milli'yi tanıyan ilk devlet hangisi olmuştur?", options: ["Ermenistan", "Gürcistan", "Sovyet Rusya", "Afganistan"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Tekalif-i Milliye Emirleri doğrultusunda halktan toplanan yardımlar hangi savaşta kullanılmıştır?", options: ["Sakarya Meydan Muharebesi", "I. İnönü Muharebesi", "II. İnönü Muharebesi", "Gediz Taarruzu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Lozan Barış Antlaşması'nda Türkiye'ye savaş tazminatı olarak verilen yer neresidir?", options: ["Karaağaç ve Bosnaköy", "Batı Trakya", "İmroz ve Bozcaada", "Musul"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1928 yılında yapılan alfabe inkılabıyla Latin harflerini halka öğretmek amacıyla açılan okullara ne denir?", options: ["Millet Mektepleri", "Köy Enstitüleri", "Darülfünun", "Mekteb-i Mülkiye"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Çağdaş Türk ve Dünya (3)
  { q: "İkinci Dünya Savaşı sırasında SSCB'nin Stalingrad savunmasında Alman ordularını durdurduğu cephe hangisidir?", options: ["Doğu Cephesi", "Normandiya Çıkarması", "Pasifik Cephesi", "Kuzey Afrika"], answer: 0, tag: "Tarih" },
  { q: "Türkiye'nin Kore Savaşı'na asker göndermesi hangi uluslararası teşkilatın aldığı karar gereğidir?", options: ["Birleşmiş Milletler (BM)", "NATO", "Varşova Paktı", "Avrupa Konseyi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kuzey Kıbrıs Türk Cumhuriyeti'nin (KKTC) kurucu cumhurbaşkanı kimdir?", options: ["Rauf Denktaş", "Fazıl Küçük", "Mehmet Ali Talat", "Derviş Eroğlu"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // ==================== COĞRAFYA (30 SORU) ====================
  // Coğrafi Konum & Fiziki (6)
  { q: "Türkiye'de dağların güney yamaçlarının kuzey yamaçlarına göre daha fazla güneş alması neyin sonucudur?", options: ["Kuzey Yarım Küre'de yengeç dönencesi dışında yer alması (Bakı)", "Boylam derecelerinin", "Yükseltinin batıdan doğuya artmasının", "Etrafındaki denizlerin"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Aynı enlem üzerindeki noktalarda aşağıdakilerden hangisi kesinlikle AYNIDIR?", options: ["Çizgisel dönüş hızı ve gece-gündüz süresi", "Yıllık sıcaklık ortalaması", "Yerel saat", "Yıllık yağış miktarı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'nin gerçek alanı ile izdüşüm alanı arasındaki farkın en fazla olduğu bölge hangisidir?", options: ["Doğu Anadolu Bölgesi", "İç Anadolu Bölgesi", "Marmara Bölgesi", "Güneydoğu Anadolu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akdeniz ve Karadeniz kıyılarında falezlerin (yalıyar) yaygın olmasının temel sebebi nedir?", options: ["Dağların kıyıya paralel ve çok dik uzanması", "Gelgit genliğinin fazlalığı", "Deltaların genişliği", "Mercan resifleri"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kuzey Anadolu Fay Hattı (KAF) üzerinde yer almayan deprem yöresi hangisidir?", options: ["Mardin Eşiği", "Düzce ve Bolu", "Erzincan Ovası", "Tokat Erbaa"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de kalkerli arazide tavan çökmesi sonucu oluşan derin doğal karstik çukurlara ne denir?", options: ["Obruk", "Mantar kaya", "Tafoni", "Sirk"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // İklim & Bitki Örtüsü (5)
  { q: "Türkiye'de kış mevsiminde Akdeniz ve Ege kıyılarında görülen cephesel yağışların temel oluşum nedeni nedir?", options: ["Sıcak ve soğuk hava kütlelerinin karşılaşması", "Havanın dağ yamacı boyunca yükselmesi", "Isınan havanın dikine yükselmesi", "Alizelerin esmesi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İç kesimlerde deniz etkisinin sokulamamasının ve karasal iklimin hüküm sürmesinin nedeni nedir?", options: ["Kıyı dağlarının kıyıya paralel uzanması", "Enlem etkisi", "Boylam farkı", "Bitki örtüsü yetersizliği"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de yaz kuraklığının belirgin olduğu bozkır alanlarında hangi ağaçlandırma türü en dayanıklıdır?", options: ["Karaçam ve meşe", "Kayın", "Göknar", "Ladin"], answer: 0, tag: "Coğrafya" },
  { q: "Güneydoğu Anadolu Bölgesi'nde yaz sıcaklıklarının rekor seviyelere ulaşmasında hangi yerel rüzgar etkilidir?", options: ["Samyeli (Keşişleme)", "Poyraz", "Karayel", "Yıldız"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akdeniz iklim bölgesinde kızılçam ormanlarının tahrip edilmesiyle oluşan bodur bitki örtüsü hangisidir?", options: ["Maki", "Bozkır", "Tundra", "Savan"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Yer Şekilleri, Su & Toprak (6)
  { q: "Akarsuların menderesler çizerek akması akarsu hakkında hangi kesin bilgiyi verir?", options: ["Yatak eğiminin ve akış hızının azaldığını", "Rejiminin düzenli olduğunu", "Debisinin çok yüksek olduğunu", "Açık havza olduğunu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Gediz, Küçük Menderes ve Büyük Menderes nehirlerinin Ege Denizi'ne döküldükleri yerde ne tür ova oluşur?", options: ["Delta ovası", "Karstik polye", "Buzul ovası", "Kanyon vadi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İç püskürük volkanik kayaç olan granitin aşınmasıyla oluşan ve Aydın Çine yöresinde görülen topoğrafyaya ne denir?", options: ["Tor Topoğrafyası", "Karstik Topoğrafya", "Kuesta", "Lapya"], answer: 0, tag: "Coğrafya" },
  { q: "Sularında bol miktarda soda bulunan ve inci kefali balığının yaşadığı ülkemizin en büyük gölü hangisidir?", options: ["Van Gölü", "Tuz Gölü", "Beyşehir Gölü", "Eğirdir Gölü"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Ergene Havzası ve Konya Kapalı Havzası'nda yaygın olan kireçli, killi kahverengi step topraklarının özelliği nedir?", options: ["Organik maddece (humus) fakir ve kireçli olması", "Aşırı yıkanmış ve asidik olması", "Yıl boyu donmuş olması", "Lateritleşmiş olması"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de heyelan olaylarının Karadeniz'de yoğunlaşmasında eğim ve yağışın yanında hangi toprak yapısı etkilidir?", options: ["Killi toprak tabakası", "Kalkerli karst", "Kumul", "Buzul moreni"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Nüfus & Yerleşme (4)
  { q: "Tuz Gölü ve çevresinin Türkiye'de en seyrek nüfuslu alanlardan biri olmasının temel sebebi nedir?", options: ["Şiddetli kuraklık ve yağış azlığı", "Aşırı engebeli arazi", "Şiddetli kış soğukları", "Orman örtüsünün sıklığı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de iç göç hareketlerinde sanayileşmiş merkezlerin göç almasının temel çekici faktörü nedir?", options: ["İş imkanlarının ve istihdamın fazlalığı", "İklim koşulları", "Yüzölçümü genişliği", "Doğal güzellikler"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Ege ve Akdeniz kıyılarında yaz aylarında nüfusun katlanarak artmasının sebebi hangi sektördür?", options: ["Yaz turizmi sektörü", "Ağır sanayi", "Madencilik", "Ormancılık"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Doğu Anadolu kırsalında yaygın olan ve birkaç haneden oluşan geçici hayvancılık yerleşmesi hangisidir?", options: ["Kom", "Divan", "Mahalle", "Çiftlik"], answer: 0, tag: "Coğrafya" },

  // Tarım & Hayvancılık (4)
  { q: "Türkiye'de sulama imkanlarının artırılmasıyla aşağıdakilerden hangisinde AZALMA görülür?", options: ["Nadasa bırakılan tarım arazisi miktarında", "Yıllık ürün veriminde", "Sanayi bitkisi ekiminde", "Tarımsal gelirde"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Güneydoğu Anadolu'da fıstık, Gaziantep ve Şanlıurfa yöresinde hangi doğal şarta uyum sağladığı için yaygındır?", options: ["Yaz kuraklığına ve kireçli toprağa", "Aşırı neme ve yağışa", "Şiddetli donlara", "Yüksek platolara"], answer: 0, tag: "Coğrafya" },
  { q: "Doğu Karadeniz ve Erzurum-Kars platolarında gür otlakların bulunması hangi hayvancılığı geliştirmiştir?", options: ["Büyükbaş mera hayvancılığı", "Tiftik keçisi yetiştiriciliği", "İpek böcekçiliği", "Kümes hayvancılığı"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  { q: "Zonguldak ve çevresinde demir-çelik sanayisinin kurulmasında hangi enerji kaynağı belirleyici olmuştur?", options: ["Taş kömürü yatakları", "Linyit yatakları", "Petrol", "Doğalgaz"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Güneydoğu Anadolu Bölgesi'nde Batman ve Adıyaman çevresinden çıkarılan hidrokarbon yer altı zenginliği hangisidir?", options: ["Ham Petrol", "Taş kömürü", "Bakır", "Boksit"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  { q: "İzmit, İzmir ve Mersin gibi liman şehirlerinde petrol rafinerilerinin kurulmasında hangi faktör etkilidir?", options: ["Ulaşım ve deniz ticareti kolaylığı", "Hammaddeye yakınlık", "Nüfus azlığı", "Enerji santralleri"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // ==================== GÜNCEL BİLGİLER (10 SORU) ====================
  { q: "UNESCO Somut Olmayan Kültürel Miras Listesi'ne giren ve Edirne'de asırlardır düzenlenen geleneksel güreş etkinliği hangisidir?", options: ["Kırkpınar Yağlı Güreşleri", "Karakucak Güreşleri", "Aba Güreşi", "Şalvar Güreşi"], answer: 0, tag: "Güncel" },
  { q: "Avrupa Birliği'nin para birimi olan Euro'yu basma ve para politikasını yönetme yetkisine sahip banka hangisidir?", options: ["Avrupa Merkez Bankası (ECB)", "Dünya Bankası", "Uluslararası Para Fonu (IMF)", "Avrupa Yatırım Bankası"], answer: 0, tag: "Güncel" },
  { q: "Kuzey Atlantik Antlaşması Örgütü olan NATO'nun genel karargahı hangi Avrupa başkentindedir?", options: ["Brüksel (Belçika)", "Strazburg (Fransa)", "Cenevre (İsviçre)", "Lahey (Hollanda)"], answer: 0, tag: "Güncel" },
  { q: "Nobel Edebiyat Ödülü'nü kazanan ilk Türk yazar kimdir?", options: ["Orhan Pamuk", "Yaşar Kemal", "Ahmet Hamdi Tanpınar", "Attila İlhan"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  { q: "Birleşmiş Milletler (BM) Genel Kurulu ve Güvenlik Konseyi'nin ana merkezi hangi şehirdedir?", options: ["New York (ABD)", "Cenevre (İsviçre)", "Paris (Fransa)", "Viyana (Avusturya)"], answer: 0, tag: "Güncel" },
  { q: "Uluslararası Adalet Divanı (UAD) hangi Hollanda şehrindeki Barış Sarayı'nda görev yapar?", options: ["Lahey", "Amsterdam", "Rotterdam", "Utrecht"], answer: 0, tag: "Güncel" },
  { q: "Türk lirasında 100 TL banknotunun arka yüzünde portresi yer alan klasik Türk müziği bestekarı kimdir?", options: ["Buhurizade Mustafa Itri", "Dede Efendi", "Hacı Arif Bey", "Tamburi Cemil Bey"], answer: 0, tag: "Güncel" },
  { q: "Türk lirasında 50 TL banknotunun arka yüzünde yer alan ilk kadın Türk romancısı kimdir?", options: ["Fatma Aliye Topuz", "Halide Edib Adıvar", "Samiha Ayverdi", "Nezihe Muhiddin"], answer: 0, tag: "Güncel" },
  { q: "Avrupa Konseyi Parlamenter Meclisi ve Avrupa Parlamentosu oturumlarının yapıldığı Fransız kenti hangisidir?", options: ["Strazburg", "Lyon", "Marsilya", "Bordeaux"], answer: 0, tag: "Güncel" }
];

// 1. Şıkları Karıştır
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soruları Rastgele Harmanla
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.correctCount += 1;
      p.streak += 1;

      // Taban Puan: 100
      let gained = 100;
      if (p.streak >= 10) gained += 50;
      else if (p.streak >= 3) gained += 25;

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      correctCount: p.correctCount,
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniye Skor Tablosu
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'KPSS ÇIKMIŞ') tagElem.className = 'cat-badge cat-cikmis';
    else if (data.tag === 'Güncel') tagElem.className = 'cat-badge cat-guncel';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    
    // Yanlış yapana eşek emojisi (🫏) + Doğru Sayısı
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 3 ? `🔥x${p.streak}` : '✅') : '🫏';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan <small style="color:#94a3b8; margin-left:8px;">(${p.correctCount} Doğru)</small></span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 70 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
