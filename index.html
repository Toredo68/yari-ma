<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS 60 Soru Maratonu (30 Tarih - 30 Coğrafya)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-cikmis { background: #dc2626; color: #fee2e2; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS GY-GK Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 30 Coğrafya (Dengeli Dağılım & Çıkmış Sorular)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/60</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-60-tarih-cografya-v1";

const questions = [
  // ==================== TARİH (30 SORU) ====================
  // İslamiyet Öncesi (4)
  { q: "Türk tarihinde ilk kez hükümdarın yetkilerini sınırlandıran töre hükümleri hangi mecliste denetlenirdi?", options: ["Kurultay (Toy)", "Ayukı", "Komenton", "İhtiyarlar"], answer: 0, tag: "Tarih" },
  { q: "İslamiyet öncesi Türk devletlerinde hükümdarın tahta çıkışında halka ikram ettiği büyük ziyafetlere ne ad verilir?", options: ["Toy (Şölen)", "Yuğ", "Kurgan", "Balbal"], answer: 0, tag: "Tarih" },
  { q: "Eski Türklerde devletin batı kanadını yöneten hükümdar soyundan gelen yöneticilere hangi unvan verilirdi?", options: ["Yabgu", "Tudun", "Bitikçi", "Ayguçı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Maniheizm inancını kabul ederek tapınak mimarisini başlatan ve yerleşik hayata geçen ilk Türk devleti hangisidir?", options: ["Uygurlar", "Göktürkler", "Hazarlar", "Kırgızlar"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // İlk Türk-İslam (4)
  { q: "Büyük Selçuklu Devleti'nde ordu mensuplarının maaş, silah ve lojistik işlerini yürüten divan hangisidir?", options: ["Divan-ı Arz (Ceyş)", "Divan-ı İstifa", "Divan-ı İnşa", "Divan-ı İşraf"], answer: 0, tag: "Tarih" },
  { q: "Türk-İslam devletlerinde ticareti geliştirmek amacıyla kervan yolları üzerine inşa edilen korunaklı konaklama yapılarına ne ad verilir?", options: ["Ribat (Kervansaray)", "Kümbet", "Bedesten", "Arasta"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Gazneli Mahmut'un 'Sarayımın en değerli hazinesi' dediği ve astronomi/fizik alanında çalışan İslam bilgini kimdir?", options: ["El-Biruni", "Farabi", "İbni Sina", "Harezmi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Anadolu Selçuklularında esnaf ve zanaatkarların dayanışmasını sağlayan dini-iktisadi teşkilat hangisidir?", options: ["Ahilik Teşkilatı", "İltizam", "Gedik", "Lonca"], answer: 0, tag: "Tarih" },

  // Osmanlı Siyasi & Kültür (10)
  { q: "Osmanlı Devleti'nde beylikten devlete geçiş süreci hangi hükümdar döneminde gerçekleşmiştir?", options: ["Orhan Bey", "Osman Bey", "I. Murad", "Yıldırım Bayezid"], answer: 0, tag: "Tarih" },
  { q: "Fatih Sultan Mehmet döneminde Karadeniz'i bir Türk gölü haline getiren son önemli fethin yapıldığı yer neresidir?", options: ["Kırım", "Trabzon", "Sinop", "Amasra"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde veraset sisteminde 'Ekber ve Erşed' (en yaşlı ve olgun hanedan üyesinin tahta geçmesi) kuralını getiren padişah kimdir?", options: ["I. Ahmed", "II. Osman", "IV. Murad", "III. Mehmed"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Sadrazamın padişah adına çıkardığı yazılı idari emirlere ne ad verilirdi?", options: ["Buyruldu", "Ferman", "Hatt-ı Hümayun", "Berat"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı ordusunda kale kuşatmalarında bomba ve el humbarası hazırlayan teknik sınıf hangisidir?", options: ["Humbaracılar", "Lağımcılar", "Cebeciler", "Topçular"], answer: 0, tag: "Tarih" },
  { q: "Gelirleri sınır boylarındaki komutanlara ve kale muhafızlarına ayrılan dirlik arazisine ne ad verilir?", options: ["Yurtluk ve Ocaklık", "Paşmaklık", "Mukataa", "Malikane"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde gayrimüslim tebaadan alınan toprak/ürün vergisi hangisidir?", options: ["Haraç", "Öşür", "Ağnam", "Avarız"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Lale Devri'nin sona ermesine yol açan ve III. Ahmed'in tahttan indirilmesiyle sonuçlanan ayaklanma hangisidir?", options: ["Patrona Halil İsyanı", "Kabakçı Mustafa İsyanı", "Çınar Vakası", "Buçuktepe İsyanı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde ilk kez tüm tebaayı kanun önünde eşit sayan ve askerliği vatan görevi haline getiren belge hangisidir?", options: ["Tanzimat Fermanı", "Sened-i İttifak", "Islahat Fermanı", "Kanun-ı Esasi"], answer: 0, tag: "Tarih" },
  { q: "II. Mahmut döneminde memurların yargılanması ve devlet reformlarının hazırlanması için kurulan yüksek meclis hangisidir?", options: ["Meclis-i Vala-yı Ahkam-ı Adliye", "Darüşşura-yı Askeri", "Heyet-i Ayan", "Divan-ı Ahkam-ı Adliye"], answer: 0, tag: "Tarih" },

  // Milli Mücadele & İnkılap (9)
  { q: "Mustafa Kemal Paşa'nın 'Artık İstanbul Anadolu'ya hakim değil, tabi olmak mecburiyetindedir' sözünü söylediği belge hangisidir?", options: ["Amasya Genelgesi", "Havza Genelgesi", "Erzurum Kongresi", "Sivas Kongresi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Manda ve himaye fikrinin kesin ve son kez reddedildiği milli kongre hangisidir?", options: ["Sivas Kongresi", "Erzurum Kongresi", "Balıkesir Kongresi", "Alaşehir Kongresi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Son Osmanlı Mebusan Meclisi'nin kabul ettiği ve milli sınırları çizen tarihi bildiri hangisidir?", options: ["Misak-ı Milli", "Amasya Protokolü", "Teşkilat-ı Esasiye", "Tekalif-i Milliye"], answer: 0, tag: "Tarih" },
  { q: "TBMM'nin varlığına karşı çıkan iç ayaklanmaları bastırmak amacıyla kurulan olağanüstü mahkemeler hangisidir?", options: ["İstiklal Mahkemeleri", "Divan-ı Harp", "Nizamiye Mahkemeleri", "Şeriye Mahkemeleri"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kurtuluş Savaşı'nda Batı Cephesi Komutanlığı'na atanan ve İnönü savaşlarını kazanan komutan kimdir?", options: ["İsmet İnönü", "Fevzi Çakmak", "Refet Bele", "Ali Fuat Cebesoy"], answer: 0, tag: "Tarih" },
  { q: "Mustafa Kemal Atatürk'ün 'Ordular, ilk hedefiniz Akdeniz'dir. İleri!' tarihi emrini verdiği zafer hangisidir?", options: ["Başkomutanlık Meydan Muharebesi (Büyük Taarruz)", "Sakarya Meydan Muharebesi", "II. İnönü Muharebesi", "Dumlupınar Baskını"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Lozan Barış Antlaşması'nda çözüme kavuşturulamayıp sonradan Türkiye lehine sonuçlanan Boğazlar rejimi hangi sözleşmeyle kesinleşmiştir?", options: ["Montrö Boğazlar Sözleşmesi", "Sadabat Paktı", "Londra Antlaşması", "Balkan Antantı"], answer: 0, tag: "Tarih" },
  { q: "1924 yılında kurulan Türkiye Cumhuriyeti'nin ilk özel ticaret bankası hangisidir?", options: ["Türkiye İş Bankası", "Sümerbank", "Etibank", "Ziraat Bankası"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türk Ceza Kanunu Cumhuriyet döneminde hangi Avrupa ülkesinin ceza kanunu örnek alınarak hazırlanmıştır?", options: ["İtalya", "İsviçre", "Almanya", "Fransa"], answer: 0, tag: "Tarih" },

  // Çağdaş Türk ve Dünya (3)
  { q: "İkinci Dünya Savaşı sonrasında dünya barışını korumak amacıyla Milletler Cemiyeti yerine kurulan uluslararası örgüt hangisidir?", options: ["Birleşmiş Milletler (BM)", "NATO", "Varşova Paktı", "Avrupa Konseyi"], answer: 0, tag: "Tarih" },
  { q: "Türkiye Cumhuriyeti hangi savaşa tugay göndererek 1952 yılında NATO'ya resmen üye olmuştur?", options: ["Kore Savaşı", "Vietnam Savaşı", "Körfez Savaşı", "Kosova Harekatı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kıbrıs'ta Türklerin can ve mal güvenliğini korumak amacıyla 1974 yılında icra edilen askeri harekat hangisidir?", options: ["Kıbrıs Barış Harekatı", "Atilla Harekatı", "Akdeniz Kalkanı", "Yıldız Harekatı"], answer: 0, tag: "Tarih" },

  // ==================== COĞRAFYA (30 SORU) ====================
  // Coğrafi Konum & Fiziki (6)
  { q: "Türkiye'nin en kuzeyi (Sinop İnceburun) ile en güneyi (Hatay Beşaslan) arasında kaç paralel farkı vardır?", options: ["6 Paralel (666 km)", "19 Paralel", "12 Paralel", "4 Paralel"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de 21 Haziran tarihinde kuzeye doğru gidildikçe gündüz süresinin uzaması hangi durumun sonucudur?", options: ["Matematik (Mutlak) Konum", "Özel Konum", "Yükselti", "Boylam Farkı"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de dağların genel olarak doğu-batı doğrultusunda uzanmasının temel jeolojik sebebi nedir?", options: ["Kuzeyden Avrasya ve güneyden Afrika/Arabistan levhalarının sıkıştırması", "İç püskürük volkanizma", "Buzullaşma etkileri", "Kalker erimeleri"], answer: 0, tag: "Coğrafya" },
  { q: "Karadeniz kıyılarında deniz seviyesinden itibaren yükselen dağların kıyıya paralel olması hangi tür yağışların oluşmasını sağlar?", options: ["Yamaç (Orografik) Yağışları", "Konveksiyonel Yağışlar", "Cephesel (Frontal) Yağışlar", "Siklonik Yağışlar"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İstanbul ve Çanakkale boğazları ile Haliç kıyıları jeomorfolojik olarak hangi kıyı tipine örnektir?", options: ["Ria Kıyı Tipi", "Dalmaçya Kıyı Tipi", "Fiyort Kıyı Tipi", "Boyuna Kıyı Tipi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kıyı oku ve dalga birikimiyle bir koy veya körfezin önünün kapanması sonucu oluşan kıyı set göllerine (Lagün) en net örnek hangisidir?", options: ["Büyükçekmece ve Küçükçekmece", "Beyşehir ve Eğirdir", "Abant ve Yedigöller", "Nemrut Gölü"], answer: 0, tag: "Coğrafya" },

  // İklim & Bitki Örtüsü (5)
  { q: "İç Anadolu Bölgesi'nde ilkbahar aylarında ısınan havanın yükselmesiyle oluşan ve halk arasında 'Kırkikindi' denilen yağış türü hangisidir?", options: ["Konveksiyonel (Yükselim) Yağışları", "Orografik Yağışlar", "Cephe Yağışları", "Muson Yağışları"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de orman üst sınırını belirleyen en temel coğrafi faktör hangisidir?", options: ["Sıcaklık yetersizliği", "Nemlilik", "Toprak cinsi", "Rüzgar hızı"], answer: 0, tag: "Coğrafya" },
  { q: "Karadeniz bölgesinde ormanların tahrip edildiği alanlarda oluşan kısa boylu çalı topluluklarına ne ad verilir?", options: ["Psödomaki (Yalancı Maki)", "Garig", "Bozkır", "Antropojen Bozkır"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de kış mevsiminde Sibirya termik yüksek basıncının etkili olduğu dönemlerde hava nasıl bir karaktere bürünür?", options: ["Ayaz, açık ve aşırı soğuk", "Ilık ve bol yağışlı", "Fırtınalı ve nemli", "Sisli ve ılık"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Toros Dağları'nın Akdeniz'e bakan güney yamaçlarının kuzey yamaçlarına göre daha sıcak olması hangi coğrafi etkiyle açıklanır?", options: ["Bakı Etkisi", "Boylam Etkisi", "Yükselti Etkisi", "Karasallık"], answer: 0, tag: "Coğrafya" },

  // Yer Şekilleri, Su & Toprak (6)
  { q: "Akarsuların biriktirme yapabilmesi ve delta ovası oluşturabilmesi için kıyıda hangi şartın bulunmaması gerekir?", options: ["Güçlü gelgit (gelgit genliği) ve kuvvetli akıntılar", "Bol alüvyon taşınması", "Kıta sahanlığının geniş olması", "Kıyının sığ olması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kalker, jips ve kaya tuzu gibi kolay eriyebilen kayaçların yaygın olduğu Akdeniz ve Sivas yöresinde hangi tür topoğrafya gelişir?", options: ["Karstik Topoğrafya", "Volkanik Topoğrafya", "Buzul Topoğrafyası", "Rüzgar Aşınım Topoğrafyası"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de sönmüş bir volkan konisi üzerinde bulunan ve dünyanın en büyük ikinci krater gölü olan göl hangisidir?", options: ["Nemrut Krater Gölü (Bitlis)", "Meke Gölü", "Gölcük Gölü", "Van Gölü"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Heyelan set göllerine Karadeniz Bölgesi'nden verilebilecek en tipik örnekler hangileridir?", options: ["Tortum, Sera, Abant ve Yedigöller", "Beyşehir ve Eğirdir", "Bafa (Çamiçi) ve Köyceğiz", "Çıldır ve Erçek"], answer: 0, tag: "Coğrafya" },
  { q: "Eski göl tabanlarındaki killi ve kireçli depolar üzerinde oluşan, halk arasında 'taş doğuran' veya 'dönen toprak' denilen toprak cinsi hangisidir?", options: ["Vertisol", "Rendzina", "Podzol", "Regosol"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Doğu Anadolu Fay Hattı (DAF) üzerinde yer alan ve tektonik çöküntü sonucu oluşmuş ovalardan biri hangisidir?", options: ["Amik Ovası", "Bafra Ovası", "Menemen Ovası", "Çarşamba Ovası"], answer: 0, tag: "Coğrafya" },

  // Nüfus & Yerleşme (4)
  { q: "Türkiye'de aritmetik nüfus yoğunluğunun en az olduğu coğrafi bölge hangisidir?", options: ["Doğu Anadolu Bölgesi", "İç Anadolu Bölgesi", "Karadeniz Bölgesi", "Güneydoğu Anadolu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Karadeniz Bölgesi'nde kırsal yerleşmelerin dağınık dokulu olmasında rol oynayan iki temel faktör hangisidir?", options: ["Engebeli arazi yapısı ve su kaynaklarının bolluğu", "Düz araziler ve kuraklık", "Toplu tarım alanları ve ulaşım", "Orman yangınları ve rüzgar"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Köy altı yerleşmelerinden olan ve Doğu/Güneydoğu Anadolu'da küçükbaş hayvancılık için kullanılan geçici yerleşme tipi hangisidir?", options: ["Kom", "Divan", "Mezra", "Mahalle"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de son yıllarda nüfus artış hızının düşmesi sebebiyle gelecekte ortaya çıkması beklenen en belirgin demografik değişim nedir?", options: ["Yaşlı nüfus oranının artması ve ortanca yaşın yükselmesi", "Çocuk nüfus oranının patlaması", "Kırsal nüfusun kentsel nüfusu geçmesi", "Genç bağımlı nüfusun artması"], answer: 0, tag: "Coğrafya" },

  // Tarım & Hayvancılık (4)
  { q: "Güneydoğu Anadolu Projesi'nin (GAP) devreye girmesi ve sulama olanaklarının artmasıyla üretiminde Türkiye birincisi haline gelen sanayi bitkisi hangisidir?", options: ["Pamuk", "Tütün", "Şeker Pancarı", "Haşhaş"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de iklim seçiciliği en az olan, kurağa ve soğuğa karşı oldukça dayanıklı olduğu için ekim alanı en geniş tahıl hangisidir?", options: ["Arpa ve Buğday", "Pirinç (Çeltik)", "Mısır", "Yulaf"], answer: 0, tag: "Coğrafya" },
  { q: "Akdeniz Bölgesi'nde engebeli kalkerli arazilere ve makiliklere uyum sağladığı için yetiştiriciliği yaygın olan küçükbaş hayvan türü hangisidir?", options: ["Kıl Keçisi", "Merinos Koyunu", "Tiftik Keçisi", "Kıvırcık Koyun"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Gelişmiş tüketici pazarlarına yakınlık nedeniyle kümes hayvancılığının (tavukçuluk) en fazla yoğunlaştığı bölge hangisidir?", options: ["Marmara ve Ege Bölgeleri", "Doğu Anadolu", "Karadeniz", "Güneydoğu Anadolu"], answer: 0, tag: "Coğrafya" },

  // Madenler, Enerji & Sanayi (5)
  { q: "Dünya rezervlerinin yaklaşık %73'ü Türkiye'de bulunan; Balıkesir (Bigadiç), Kütahya (Emet) ve Eskişehir'de (Seyitgazi) çıkarılan stratejik maden hangisidir?", options: ["Bor", "Krom", "Bakır", "Boksit"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Alüminyumun hammaddesi olan ve Antalya Akseki ile Konya Seydişehir'de çıkarılıp işlenen maden hangisidir?", options: ["Boksit", "Barit", "Krom", "Manganez"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'nin elektrik üretiminde yerli linyit kömürü ile çalışan büyük termik santrallerden biri hangisidir?", options: ["Afşin-Elbistan", "Hamitabat", "Çatalağzı", "Ovaakça"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de ilk rüzgar enerjisi santrali hangi ilimizde ve ilçemizde kurulmuştur?", options: ["İzmir (Çeşme - Alaçatı)", "Balıkesir (Bandırma)", "Çanakkale (Bozcaada)", "Aydın (Didim)"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Hammaddeye yakınlık ilkesi doğrultusunda çay işleme fabrikalarının tamamının Doğu Karadeniz kıyısında toplanmasının temel sebebi nedir?", options: ["Çay yaprağının toplandıktan sonra çok çabuk bozulması", "Ulaşım maliyetlerinin ucuz olması", "Enerji santrallerine yakınlık", "Yalnızca bölgede işçi bulunması"], answer: 0, tag: "Coğrafya" }
];

// 1. Şıkları Karıştır (Doğru seçenek rastgele dağılsın)
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soruları Karıştır (Tarih ve Coğrafya rastgele harmanlansın)
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, streak: 0, answer: null, answerTime: 0, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, streak: 0, answer: null, answerTime: 0, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      p.answerTime = data.timeRemaining;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.answerTime = 0; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;
  const currentLeaderScore = Math.max(...players.map(p => p.score), 0);

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.streak += 1;
      let gained = 300 + (p.answerTime * 20);

      if (p.streak >= 3) gained += 100;
      else if (p.streak === 2) gained += 50;

      // COMEBACK MEKANİZMASI
      const deficit = currentLeaderScore - p.score;
      if (deficit >= 1500) {
        gained = Math.round(gained * 1.4);
      } else if (deficit >= 800) {
        gained = Math.round(gained * 1.25);
      }

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniyelik Bekleme
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'KPSS ÇIKMIŞ') tagElem.className = 'cat-badge cat-cikmis';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    
    // Yanlış yapana eşek emojisi (🫏), bilene rozet
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 2 ? `🔥x${p.streak}` : '✅') : '🙉';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan</span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 60 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx, timeRemaining: timeLeft };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; me.answerTime = timeLeft; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
