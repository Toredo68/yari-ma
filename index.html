<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS 70 Soru Maratonu (Tarih - Coğrafya - Güncel)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }

    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
    .cat-guncel { background: #d97706; color: #fef3c7; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS Genel Kültür Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 30 Coğrafya + 10 Güncel Bilgiler (70 Soru)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/70</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-70-maraton-guncel-v2";

const questions = [
  // ==================== TARİH (30 SORU) ====================
  { q: "Eski Türklerde savaşa giderken veya törenlerde sancakların tepesine takılan at kuyruğu veya kurt başına ne ad verilirdi?", options: ["Tuğ", "Kotuz", "Yarlık", "Kur"], answer: 0, tag: "Tarih" },
  { q: "İslamiyet öncesinde Türk hükümdarlarının giydiği ipekli ve işlemeli resmi hükümdarlık kaftanına ne denirdi?", options: ["Hilat / Yanşak", "Kotuz", "Örgün", "Kama"], answer: 0, tag: "Tarih" },
  { q: "Bizans'a karşı Sasani Devleti ile iş birliği yaparak İstanbul'u kuşatan Türk devleti hangisidir?", options: ["Avarlar", "Hazarlar", "Hunlar", "Karluklar"], answer: 0, tag: "Tarih" },
  { q: "Eski Türklerde devletin resmi yazışmalarında kullanılan hükümdar mührüne ne ad verilirdi?", options: ["Tamga", "Balbal", "Tudun", "Bark"], answer: 0, tag: "Tarih" },
  { q: "Mısır'da Tolunoğulları tarafından inşa edilen ve içinde din ve ırk ayrımı yapılmaksızın ücretsiz tedavi sunulan hastanelere ne ad verilirdi?", options: ["Maristan", "Bimarhane", "Darüşşifa", "Ribat"], answer: 0, tag: "Tarih" },
  { q: "Büyük Selçuklu Devleti'nde sultanın şahsi koruma muhafızlarından oluşan maaşlı merkez ordusuna ne ad verilirdi?", options: ["Gulamân-ı Saray", "İkta Askerleri", "Subaşı", "Hassa Ordusu"], answer: 0, tag: "Tarih" },
  { q: "Anadolu Selçuklularında esnaf teşkilatında üretilen malların hilesiz olmasını denetleyen görevliye ne ad verilirdi?", options: ["Muhtesip", "Kadı", "Kethüda", "Subaşı"], answer: 0, tag: "Tarih" },
  { q: "Anadolu'da kurulan ilk Türk beyliklerinden Artuklular döneminde yaşayan sibernetik ve robotik biliminin öncüsü İslam bilgini kimdir?", options: ["El-Cezeri", "Ali Kuşçu", "Uluğ Bey", "Harezmi"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde fethedilen Hristiyan topraklarındaki çocukların belirli usullerle toplanıp ordu ve bürokrasiye kazandırılması sistemine ne denir?", options: ["Devşirme Sistemi", "İskân Politikası", "İstimalet", "Tımar Sistemi"], answer: 0, tag: "Tarih" },
  { q: "Yıldırım Bayezid döneminde inşa edilen, 20 kubbesiyle erken dönem Osmanlı mimarisinin en anıtsal camisi kabul edilen eser hangisidir?", options: ["Bursa Ulu Camii", "Edirne Eski Camii", "Yeşil Cami", "Muradiye Camii"], answer: 0, tag: "Tarih" },
  { q: "Fatih Sultan Mehmet'in Bosna fethinden sonra bölgedeki Latin rahiplerine can ve ibadet hürriyeti tanıdığı tarihi ferman hangisidir?", options: ["Ahidname (Bosna Fermanı)", "Adaletname", "Kanunname-i Âl-i Osman", "Hatt-ı Hümayun"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde padişahın mutlak vekili olup padişahın mührünü (Mühr-i Hümayun) taşıyan en üst düzey devlet adamı kimdir?", options: ["Sadrazam (Veziriazam)", "Şeyhülislam", "Kaptan-ı Derya", "Nişancı"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde medrese mezunlarının atama sırası beklemelerine verilen tarihi terim hangisidir?", options: ["Mülazemet Sistemi", "Gedik Sistemi", "Narh", "Cülus"], answer: 0, tag: "Tarih" },
  { q: "Divan-ı Hümayun'da devletin gelir ve gider hesaplarını tutan, bütçeyi denetleyen kalemiye sınıfı başkanı kimdir?", options: ["Defterdar", "Kazasker", "Nişancı", "Reisülküttab"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı donanmasının Akdeniz'de Haçlı ittifakı tarafından yakıldığı 1571 tarihli ilk büyük deniz hezimeti hangisidir?", options: ["İnebahtı Deniz Savaşı", "Çeşme Baskını", "Navarin Olayı", "Sinop Baskını"], answer: 0, tag: "Tarih" },
  { q: "Köprülüler Dönemi'nde şartlar öne sürerek sadrazamlık makamını kabul eden ilk Osmanlı devlet adamı kimdir?", options: ["Köprülü Mehmed Paşa", "Köprülü Fazıl Ahmed Paşa", "Merzifonlu Kara Mustafa Paşa", "Amcazade Hüseyin Paşa"], answer: 0, tag: "Tarih" },
  { q: "Lale Devri'nde tulumbacılar ocağı adıyla ilk kez kurulan teşkilat günümüzde hangi kamu kurumunun temelidir?", options: ["İtfaiye Teşkilatı", "Polis Teşkilatı", "Posta İdaresi", "Kızılay"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde 'Gülhane Parkı'nda okunarak ilan edilen ve padişahın kanun gücünün üstünlüğünü kabul ettiği 1839 fermanı hangisidir?", options: ["Tanzimat Fermanı", "Islahat Fermanı", "Sened-i İttifak", "Kanun-ı Esasi"], answer: 0, tag: "Tarih" },
  { q: "II. Abdülhamid döneminde Şam ile Medine arasına döşenen ve finansmanı Müslümanların bağışlarıyla sağlanan demir yolu hangisidir?", options: ["Hicaz Demiryolu", "Bağdat Demiryolu", "Rumeli Demiryolu", "Anadolu Demiryolu"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı borçlarını denetlemek ve doğrudan belirli devlet gelirlerine el koymak amacıyla 1881'de kurulan Avrupalı kurum hangisidir?", options: ["Düyun-ı Umumiye İdaresi", "Reji İdaresi", "Osmanlı Bankası", "Darphane-i Amire"], answer: 0, tag: "Tarih" },
  { q: "Mustafa Kemal'in askeri ateşe olarak görev yaptığı ve Batı diplomasisini yakından gözlemlediği Balkan şehri hangisidir?", options: ["Sofya", "Selanik", "Manastır", "Üsküp"], answer: 0, tag: "Tarih" },
  { q: "Mondros Ateşkes Antlaşması'nın 'İtilaf devletleri güvenliklerini tehdit eden herhangi bir stratejik noktayı işgal edebilir' diyen meşhur maddesi hangisidir?", options: ["7. Madde", "24. Madde", "1. Madde", "12. Madde"], answer: 0, tag: "Tarih" },
  { q: "İzmir'in işgali sonrasında Batı Anadolu'da Türklerin haklılığını ve Yunan zulmünü ortaya koyan ilk uluslararası rapor hangisidir?", options: ["Amiral Bristol Raporu", "General Harbord Raporu", "Milne Raporu", "Sandler Raporu"], answer: 0, tag: "Tarih" },
  { q: "Mustafa Kemal'in 'Siz orada yalnız düşmanı değil, milletin makus talihini de yendiniz' telgrafını çektiği muharebe hangisidir?", options: ["II. İnönü Muharebesi", "I. İnönü Muharebesi", "Sakarya Meydan Muharebesi", "Büyük Taarruz"], answer: 0, tag: "Tarih" },
  { q: "Doğu Trakya'nın (Edirne, Tekirdağ, Kırklareli) tek bir kurşun sıkılmadan diplomatik yolla kurtarıldığı mütareke hangisidir?", options: ["Mudanya Ateşkes Antlaşması", "Mondros Mütarekesi", "Gümrü Antlaşması", "Ankara Antlaşması"], answer: 0, tag: "Tarih" },

  { q: "1931 yılında kurulan ve Türk tarihinin kökenlerini bilimsel yöntemlerle araştırmayı hedefleyen cemiyet hangisidir?", options: ["Türk Tarih Kurumu", "Türk Dil Kurumu", "Tarih-i Osmani Encümeni", "Dil ve Tarih-Coğrafya Mektebi"], answer: 0, tag: "Tarih" },
  { q: "1930 yılında yerel yönetimlerde, 1934 yılında ise genel seçimlerde Türk kadınına hangi siyasi hak tanınmıştır?", options: ["Milletvekili seçme ve seçilme hakkı", "Muhtarlık hakkı", "Belediye başkanlığı", "Miras hakkı"], answer: 0, tag: "Tarih" },
  { q: "Atatürk'ün vefat ettiği gün TBMM tarafından Türkiye Cumhuriyeti'nin 2. Cumhurbaşkanı seçilen devlet adamı kimdir?", options: ["İsmet İnönü", "Celal Bayar", "Fevzi Çakmak", "Kazım Karabekir"], answer: 0, tag: "Tarih" },
  { q: "İkinci Dünya Savaşı sonrasında ABD'nin Batı Avrupa ülkelerini ekonomik olarak kalkındırmak için başlattığı yardım planı hangisidir?", options: ["Marshall Planı", "Truman Doktrini", "Monroe Doktrini", "Eisenhower Doktrini"], answer: 0, tag: "Tarih" },

  // ==================== COĞRAFYA (30 SORU) ====================
  { q: "Türkiye'nin matematik konumu gereği cephesel (frontal) yağışların görülmesi hangi enlem kuşağında yer almasının sonucudur?", options: ["Orta Kuşak (Ilıman Kuşak)", "Tropikal Kuşak", "Kutup Kuşağı", "Ekvator Kuşağı"], answer: 0, tag: "Coğrafya" },

  { q: "Ege Bölgesi'nde kırılma sonucu yükselen kütlelere 'horst', çöken çukur sahalara ne ad verilir?", options: ["Graben", "Polye", "Uvala", "Sintin"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'nin tektonik oluşumlu en büyük tatlı su gölü aşağıdakilerden hangisidir?", options: ["Beyşehir Gölü", "Eğirdir Gölü", "İznik Gölü", "Uluabat Gölü"], answer: 0, tag: "Coğrafya" },
  { q: "Sularını denize ulaştıramayan göllerin oluşturduğu kapalı havzalara Türkiye'den en belirgin örnek hangisidir?", options: ["Tuz Gölü ve Van Gölü Havzası", "Çarşamba Havzası", "Gediz Havzası", "Yeşilırmak Havzası"], answer: 0, tag: "Coğrafya" },

  { q: "Akdeniz iklim bölgesinde yaz aylarının kurak geçmesinde etkili olan dinamik yüksek basınç merkezi hangisidir?", options: ["Asor Dinamik Yüksek Basıncı", "Sibirya Yüksek Basıncı", "Basra Alçak Basıncı", "İzlanda Alçak Basıncı"], answer: 0, tag: "Coğrafya" },

  { q: "Ege Bölgesi'nde Manisa, İzmir ve Aydın yöresinde üretimi yoğunlaşan ve ihracatta önemli yer tutan meyve hangisidir?", options: ["Çekirdeksiz Kuru Üzüm", "Fındık", "Çay", "Kayısı"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de dut yaprağının yetiştiği Bursa, Diyarbakır ve Antalya yöresinde yapılan geleneksel hayvancılık türü hangisidir?", options: ["İpek Böcekçiliği", "Arıcılık", "Kıl Keçisi Yetiştiriciliği", "Kültür Balıkçılığı"], answer: 0, tag: "Coğrafya" },
  { q: "Muğla, Artvin ve Rize gibi engebeli ve zengin bitki örtüsüne sahip sahalarda en yaygın hayvancılık faaliyeti hangisidir?", options: ["Arıcılık", "Büyükbaş Besicilik", "Kümes Hayvancılığı", "Merinos Koyunculuğu"], answer: 0, tag: "Coğrafya" },
  { q: "Artvin Murgul ve Kastamonu Küre yörelerinde zengin yatakları bulunan, elektrik-elektronik sanayisinin temel madeni hangisidir?", options: ["Bakır", "Boksit", "Krom", "Bor"], answer: 0, tag: "Coğrafya" },
  { q: "Sivas Divriği ve Malatya Hekimhan-Hasançelebi havzasında en zengin rezervleri bulunan metalik maden hangisidir?", options: ["Demir", "Bakır", "Krom", "Cıva"], answer: 0, tag: "Coğrafya" },
  { q: "Batman'da çıkarılan petrolün işlendiği Türkiye'nin ilk petrol rafinerisi hangisidir?", options: ["Batman Rafinerisi", "Tüpraş Kırıkkale", "İpraş (İzmit)", "Star (İzmir)"], answer: 0, tag: "Coğrafya" },
  { q: "İç Anadolu'da Konya Karapınar bölgesinde devasa güneş panelleriyle kurulan enerji tesisi ne tür bir santraldir?", options: ["Güneş Enerji Santrali (GES)", "Rüzgar Santrali (RES)", "Jeotermal Santral (JES)", "Hidroelektrik Santral (HES)"], answer: 0, tag: "Coğrafya" },

  // ==================== GÜNCEL BİLGİLER (10 SORU) ====================
  { q: "UNESCO Dünya Mirası Listesi'nde yer alan ve 'tarihin sıfır noktası' olarak nitelendirilen Şanlıurfa'daki neolitik yerleşim hangisidir?", options: ["Göbeklitepe", "Çatalhöyük", "Yassıhöyük", "Alacahöyük"], answer: 0, tag: "Güncel" },
  { q: "Türkiye'nin uzaya gönderdiği ilk yerli ve milli haberleşme uydusu hangisidir?", options: ["Türksat 6A", "Türksat 5B", "Göktürk-1", "Rasat"], answer: 0, tag: "Güncel" },
  { q: "Türkiye'nin ilk yerli elektrikli otomobil markası olan TOGG'un üretim fabrikası hangi ilimizdedir?", options: ["Bursa (Gemlik)", "Kocaeli (Gölcük)", "Sakarya (Arifiye)", "Eskişehir"], answer: 0, tag: "Güncel" },
  { q: "Avrupa İnsan Hakları Mahkemesi (AİHM) hangi uluslararası teşkilatın bünyesinde yargı faaliyetini sürdürür?", options: ["Avrupa Konseyi", "Avrupa Birliği", "Birleşmiş Milletler", "NATO"], answer: 0, tag: "Güncel" },
  { q: "Birleşmiş Milletler Eğitim, Bilim ve Kültür Örgütü olan UNESCO'nun genel merkezi hangi şehirdedir?", options: ["Paris (Fransa)", "Cenevre (İsviçre)", "New York (ABD)", "Roma (İtalya)"], answer: 0, tag: "Güncel" },
  { q: "Türk lirasında 200 TL banknotunun arka yüzünde portresi yer alan ünlü Türk mutasavvıf ve şairi kimdir?", options: ["Yunus Emre", "Mevlana", "Hacı Bektaş Veli", "Ahmet Yesevi"], answer: 0, tag: "Güncel" },
  { q: "Türkiye Cumhuriyeti Merkez Bankası'nın (TCMB) idari yönetim merkezi hangi şehrimizdedir?", options: ["Ankara", "İstanbul", "İzmir", "Bursa"], answer: 0, tag: "Güncel" },
  { q: "Antarktika'da bilimsel araştırmalar yapmak üzere kurulan Türk Bilimsel Araştırma Kampı hangi adada yer almaktadır?", options: ["Horseshoe Adası", "Kral George Adası", "Livingston Adası", "Ross Adası"], answer: 0, tag: "Güncel" },
  { q: "Dünya Sağlık Örgütü'nün (WHO) genel merkezi hangi İsviçre şehrindedir?", options: ["Cenevre", "Zürih", "Bern", "Lozan"], answer: 0, tag: "Güncel" },
  { q: "Türkiye'nin ilk astronotu olarak Uluslararası Uzay İstasyonu'nda (ISS) bilimsel deneyler gerçekleştiren kişi kimdir?", options: ["Alper Gezeravcı", "Tuva Cihangir Atasever", "Halil Kayıkçı", "Ercan Şahin"], answer: 0, tag: "Güncel" }
];

// 1. Şıkları Karıştır
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soruları Rastgele Harmanla
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.correctCount += 1;
      p.streak += 1;

      // Taban Puan: 100 Puan
      let gained = 100;

      // GÜNCELLENEN SERİ KURALI:
      // +10 ve üzeri seri -> +50 Puan (Toplam: 150)
      // +3 ve üzeri seri  -> +25 Puan (Toplam: 125)
      // 1 veya 2 seri     -> Ek puan yok (Toplam: 100)
      if (p.streak >= 10) {
        gained += 50;
      } else if (p.streak >= 3) {
        gained += 25;
      }

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      correctCount: p.correctCount,
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniye Skor Ekranı
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'Güncel') tagElem.className = 'cat-badge cat-guncel';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    
    // Doğru/Yanlış simgesi + Seri rozeti + Doğru sayısı
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 3 ? `🔥x${p.streak}` : '✅') : '🙉';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan <small style="color:#94a3b8; margin-left:8px;">(${p.correctCount} Doğru)</small></span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 70 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
