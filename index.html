<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AGS Coğrafya Bilgi Yarışması</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
    .card { background: #1e293b; border-radius: 14px; padding: 24px; max-width: 620px; margin: 20px auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; margin-top: 8px; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    input { padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; width: calc(100% - 26px); margin-bottom: 12px; font-size: 16px; }
    .option-btn { display: block; width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { background: #4338ca; border-color: #818cf8; }
    .scoreboard { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-top: 20px; }
    .status-badge { display: inline-block; padding: 5px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: #334155; color: #38bdf8; }
    .player-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="setup-panel" class="card">
    <h2>AGS Coğrafya Yarışması</h2>
    <div style="margin-bottom: 20px;">
      <input type="text" id="player-name" placeholder="Adınızı girin..." />
      <button class="btn" style="background: #10b981;" onclick="joinAsPlayer()">Yarışmaya Katıl</button>
    </div>
    <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
    <button class="btn" style="background: #6366f1;" onclick="startAsHost()">Ben Yöneteceğim (Sunucu Ol)</button>
  </div>

  <!-- YÖNETİCİ EKRANI -->
  <div id="host-panel" class="card" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Yönetici Masası</h3>
      <span class="status-badge" id="host-status">Oda Açılıyor...</span>
    </div>
    <p>Bağlanan Yarışmacılar (<span id="connected-count">0</span> / 3):</p>
    <div id="players-list"></div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
    <button id="next-q-btn" class="btn" onclick="sendNextQuestion()" disabled>Soruyu Başlat</button>
    <p id="host-q-preview" style="margin-top: 15px; color: #cbd5e1;"></p>

    <div class="scoreboard">
      <strong>Canlı Puan Durumu:</strong>
      <div id="host-scores" style="margin-top: 10px;"></div>
    </div>
  </div>

  <!-- YARIŞMACI EKRANI -->
  <div id="client-panel" class="card" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="client-greeting">Yarışmacı</h3>
      <span class="status-badge" id="client-status">Odaya bağlanıyor...</span>
    </div>
    <div id="client-question-box" style="margin-top: 20px;">
      <h3 id="client-question-text" style="color: #f8fafc; font-size: 18px;">Soru bekleniyor...</h3>
      <div id="client-options"></div>
    </div>
    <div id="client-feedback" style="margin-top: 15px; font-weight: 600; font-size: 16px;"></div>
  </div>

<script>
// Sabit oda kimliği (kimse kod girmekle uğraşmaz)
const ROOM_ID = "ags-cografya-odasi-v1";

const questions = [
  {
    q: "Aşağıdaki ovalardan hangisi bir delta ovası özelliği göstermez?",
    options: ["Çarşamba", "Silifke", "Bafra", "Elmalı", "Balat"],
    answer: 3
  },
  {
    q: "Türkiye'nin en büyük delta ovası olan Çukurova'yı oluşturan akarsular hangileridir?",
    options: ["Gediz - Bakırçay", "Seyhan - Ceyhan", "Kızılırmak - Yeşilırmak", "Büyük Menderes - Küçük Menderes", "Fırat - Dicle"],
    answer: 1
  },
  {
    q: "Akdeniz Bölgesi'ndeki Göller Yöresi ve Teke Yarımadası'nda yaygın olan ova türü hangisidir?",
    options: ["Tektonik Ova", "Delta Ovası", "Karstik Ova (Polye)", "Taban Seviyesi Ovası", "Dağ Eteği Ovası"],
    answer: 2
  },
  {
    q: "Kuzey Anadolu Fay Hattı (KAF) üzerinde yer alan aşağıdaki ovalardan hangisi tektonik kökenlidir?",
    options: ["Erbaa - Niksar", "Menemen", "Dikili", "Çarşamba", "Tefenni"],
    answer: 0
  },
  {
    q: "Türkiye'nin en doğusu ile en batısı arasında kaç dakikalık yerel saat farkı vardır?",
    options: ["44", "60", "76", "92", "80"],
    answer: 2
  }
];

let peer = null;
let connections = [];
let currentQIndex = -1;
let roundActive = false;

// --- HOST BÖLÜMÜ ---
function startAsHost() {
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('host-panel').style.display = 'block';

  // Sabit ID ile oda açıyoruz
  peer = new Peer(ROOM_ID);

  peer.on('open', () => {
    document.getElementById('host-status').innerText = "Oda Açık (Hazır)";
    document.getElementById('host-status').style.color = "#4ade80";
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      alert("Bu oda zaten şu an açık! Başka bir sekmede host açık kalmış olabilir.");
    }
  });

  peer.on('connection', (conn) => {
    conn.on('data', (data) => {
      if (data.type === 'JOIN') {
        connections.push({ conn, name: data.name, score: 0, hasAnswered: false });
        updateHostUI();
        if (connections.length >= 1) {
          document.getElementById('next-q-btn').disabled = false;
        }
      } else if (data.type === 'ANSWER') {
        handleAnswer(conn.peer, data.choice);
      }
    });

    conn.on('close', () => {
      connections = connections.filter(c => c.conn.peer !== conn.peer);
      updateHostUI();
    });
  });
}

function updateHostUI() {
  document.getElementById('connected-count').innerText = connections.length;
  document.getElementById('players-list').innerHTML = connections
    .map(c => `<div class="player-row"><span>👤 ${c.name}</span><span style="color:#4ade80;">Bağlı</span></div>`)
    .join('');
  renderScores();
}

function renderScores() {
  document.getElementById('host-scores').innerHTML = connections
    .map(c => `<div class="player-row"><span>${c.name}</span><span><strong>${c.score} Puan</strong></span></div>`)
    .join('');
}

function sendNextQuestion() {
  currentQIndex++;
  if (currentQIndex >= questions.length) {
    alert("Sorular bitti!");
    return;
  }

  roundActive = true;
  connections.forEach(c => c.hasAnswered = false);

  const q = questions[currentQIndex];
  document.getElementById('host-q-preview').innerText = `Soru: ${q.q}`;

  connections.forEach(c => {
    c.conn.send({
      type: 'QUESTION',
      question: q.q,
      options: q.options
    });
  });
}

function handleAnswer(peerId, choice) {
  if (!roundActive) return;
  const p = connections.find(c => c.conn.peer === peerId);
  if (!p || p.hasAnswered) return;

  p.hasAnswered = true;
  if (choice === questions[currentQIndex].answer) {
    p.score += 10;
    roundActive = false;
    connections.forEach(c => {
      c.conn.send({
        type: 'ROUND_RESULT',
        winner: p.name,
        correct: questions[currentQIndex].options[questions[currentQIndex].answer]
      });
    });
    renderScores();
  } else {
    p.conn.send({ type: 'WRONG' });
  }
}

// --- CLIENT (YARIŞMACI) BÖLÜMÜ ---
function joinAsPlayer() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) return alert("Lütfen adını yaz!");

  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('client-panel').style.display = 'block';
  document.getElementById('client-greeting').innerText = name;

  peer = new Peer();

  peer.on('open', () => {
    // Doğrudan sabit odaya bağlanır
    const conn = peer.connect(ROOM_ID);

    conn.on('open', () => {
      conn.send({ type: 'JOIN', name: name });
      document.getElementById('client-status').innerText = "Bağlandı";
      document.getElementById('client-status').style.color = "#4ade80";
    });

    conn.on('data', (data) => {
      if (data.type === 'QUESTION') {
        showQuestion(conn, data.question, data.options);
      } else if (data.type === 'ROUND_RESULT') {
        document.getElementById('client-feedback').innerText = `Doğru cevap verildi! Kazanan: ${data.winner} (${data.correct})`;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      } else if (data.type === 'WRONG') {
        document.getElementById('client-feedback').innerText = "❌ Yanlış cevap! Diğerleri devam ediyor...";
      }
    });
  });
}

function showQuestion(conn, q, opts) {
  document.getElementById('client-question-text').innerText = q;
  document.getElementById('client-feedback').innerText = "";
  const box = document.getElementById('client-options');
  box.innerHTML = "";

  opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;
    btn.onclick = () => {
      conn.send({ type: 'ANSWER', choice: idx });
      btn.style.borderColor = "#38bdf8";
    };
    box.appendChild(btn);
  });
}
</script>
</body>
</html>
