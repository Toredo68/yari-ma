<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS 70 Soru Maratonu (Tarih - Coğrafya - Güncel)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-cikmis { background: #dc2626; color: #fee2e2; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
    .cat-guncel { background: #d97706; color: #fef3c7; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS Genel Kültür Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 30 Coğrafya + 10 Güncel (70 Yeni Soru)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/70</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-70-maraton-guncel-v4";

const questions = [
  // ==================== TARİH (30 SORU) ====================
  // İslamiyet Öncesi (4)
  { q: "Kavimler Göçü'nün Avrupa'da feodalite (derebeylik) rejiminin doğmasına yol açan en temel nedeni nedir?", options: ["Merkezi krallıkların otoritesini kaybetmesi ve halkın senyörlere sığınması", "Roma İmparatorluğu'nun İslamiyeti seçmesi", "Skolastik felsefenin tamamen terk edilmesi", "Türklerin Hristiyanlığı yasaklaması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İslamiyet öncesi Türk devletlerinde ordunun sağ ve sol kollarını yöneten hanedan mensubu komutanlara ne ad verilirdi?", options: ["Şad", "Tudun", "Bitikçi", "Tamgacı"], answer: 0, tag: "Tarih" },
  { q: "Türklerin göçebe yaşantısında kadın ve erkeğin eşit haklara sahip olmasında hangi toplumsal özellik etkili olmuştur?", options: ["Sınıfsız toplum yapısı ve kadının üretim ile savunmada aktif rolü", "Çok eşliliğin zorunlu olması", "Kadınların orduya alınmaması", "Toprak mülkiyetinin yalnızca kadınlara ait olması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Eski Türklerde devletler arası diplomatik elçilere verilen unvan aşağıdakilerden hangisidir?", options: ["Yalvaç (Elçi)", "Ayguçı", "Yarguçı", "Subaşı"], answer: 0, tag: "Tarih" },

  // İlk Türk-İslam (4)
  { q: "Tolunoğulları ve İhşidiler devletlerinin kısa sürede yıkılmalarının en belirleyici ortak sebebi nedir?", options: ["Yöneticilerinin Türk, halkının ise çoğunlukla Arap olması", "Haçlı seferlerine karşı koyamamaları", "Bizans ile ittifak kurmaları", "Moğol istilasına uğramaları"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Büyük Selçuklu Devleti'nde arazi kayıtlarının tutulduğu, dirlik ve ikta dağıtımının yapıldığı divan hangisidir?", options: ["Divan-ı Pervane", "Divan-ı İstifa", "Divan-ı İşraf", "Divan-ı Arz"], answer: 0, tag: "Tarih" },
  { q: "Anadolu Türk beyliklerinden Dulkadiroğulları'na son vererek Anadolu Türk siyasi birliğini kesin olarak sağlayan Osmanlı padişahı kimdir?", options: ["Yavuz Sultan Selim (Turnadağ Savaşı)", "Fatih Sultan Mehmet", "Yıldırım Bayezid", "Kanuni Sultan Süleyman"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türk-İslam devletlerinde sultanın saraydaki güvenliğinden ve teşrifat (protokol) işlerinden sorumlu en yetkili saray görevlisi kimdir?", options: ["Hâcip (Hacibü'l-Hüccab)", "Silahtar", "Emir-i Ahur", "Çaşnigir"], answer: 0, tag: "Tarih" },

  // Osmanlı Siyasi & Kültür (10)
  { q: "Osmanlı Devleti'nde fethedilen yerlerde yerli halkın inanç ve adetlerine saygı gösterilerek devlete bağlanmasını sağlayan hoşgörü politikasına ne ad verilir?", options: ["İstimalet Politikası", "İskân Politikası", "Müsadere", "Gedik"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Anadolu Hisarı (Güzelcehisar) hangi Osmanlı padişahı tarafından İstanbul kuşatması amacıyla yaptırılmıştır?", options: ["Yıldırım Bayezid", "Orhan Bey", "Fatih Sultan Mehmet", "II. Murad"], answer: 0, tag: "Tarih" },
  { q: "Kanuni Sultan Süleyman döneminde Avusturya ile imzalanan ve Avusturya arşidükünün Osmanlı sadrazamına denk sayıldığı antlaşma hangisidir?", options: ["1533 İstanbul (İbrahim Paşa) Antlaşması", "Zitvatorok Antlaşması", "Vasvar Antlaşması", "Karlofça Antlaşması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nde top dökümü ve topçuluk işlerinden sorumlu askeri ocak hangisidir?", options: ["Topçu Ocağı", "Cebeci Ocağı", "Lağımcı Ocağı", "Humbaracı Ocağı"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde padişah çocuklarının dünyaya gelmesi veya sünnet törenleri vesilesiyle düzenlenen şenlikleri anlatan minyatürlü eserlere ne ad verilir?", options: ["Surname", "Siyasetname", "Gazavatname", "Kıyafetname"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "17. yüzyılda IV. Mehmed döneminde devletin gelir-gider dengesini kurmak amacıyla ilk kez modern anlamda denk bütçe hazırlayan sadrazam kimdir?", options: ["Tarhuncu Ahmed Paşa", "Köprülü Mehmed Paşa", "Merzifonlu Kara Mustafa Paşa", "Fazıl Mustafa Paşa"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı Devleti'nin Batı tarzında açtığı ilk askeri yüksekokul kabul edilen Hendesehane (Mühendishane) hangi padişah döneminde kurulmuştur?", options: ["I. Mahmud", "III. Ahmed", "III. Mustafa", "III. Selim"], answer: 0, tag: "Tarih" },
  { q: "Boğazlar meselesini ilk kez uluslararası bir krize dönüştüren ve Osmanlı ile Rusya arasında imzalanan 1833 tarihli ittifak antlaşması hangisidir?", options: ["Hünkar İskelesi Antlaşması", "Balta Limanı Ticaret Sözleşmesi", "Edirne Antlaşması", "Küçük Kaynarca Antlaşması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Tanzimat Dönemi'nde gayrimüslim tebaanın devlet memuru olabilmesine ve küçük düşürücü sözlerin yasaklanmasına olanak tanıyan belge hangisidir?", options: ["Islahat Fermanı (1856)", "Tanzimat Fermanı", "Sened-i İttifak", "Kanun-ı Esasi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "II. Abdülhamid döneminde İslamcılık (Panislamizm) politikasının resmi devlet ideolojisi haline getirilmesinin temel amacı nedir?", options: ["Devletin dağılmasını önlemek ve Müslüman tebaayı bir arada tutmak", "Batılılaşmayı hızlandırmak", "Türkçülük akımını yaymak", "Meclisi Mebusan'ı güçlendirmek"], answer: 0, tag: "Tarih" },

  // Milli Mücadele & İnkılap (9)
  { q: "Kafkas Cephesi'nde Rus işgaline karşı mücadele eden ve Muş ile Bitlis'i Ruslardan geri alan Osmanlı komutanı kimdir?", options: ["Mustafa Kemal Paşa", "Enver Paşa", "Kazım Karabekir", "Hafız Hakkı Paşa"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Mondros Ateşkes Antlaşması imzalandığı sırada Mustafa Kemal Paşa hangi askeri görevde bulunmaktaydı?", options: ["Yıldırım Orduları Grup Komutanı", "9. Ordu Müfettişi", "Çanakkale Anafartalar Grup Komutanı", "Harp Akademisi Müdürü"], answer: 0, tag: "Tarih" },
  { q: "Kurtuluş Savaşı'nda Batı Anadolu'da Kuvayımilliye birliklerinin sevk ve idaresi amacıyla toplanan sivil kongreler hangileridir?", options: ["Balıkesir ve Alaşehir Kongreleri", "Erzurum ve Sivas Kongreleri", "Pozantı ve Havza Kongreleri", "Afyon ve Kars Kongreleri"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "I. TBMM'nin hükümet üyelerini doğrudan meclis içinden oylamayla tek tek seçtiği yönetim sistemine ne ad verilir?", options: ["Meclis Hükümeti Sistemi", "Kabine Sistemi", "Parlamenter Sistem", "Başkanlık Sistemi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kurtuluş Savaşı'nda güney cephesinde Fransız işgalcilere karşı ilk kurşunu sıkarak direnişi başlatan kahraman kimdir?", options: ["Kara Mehmet Çavuş (Dörtyol)", "Sütçü İmam", "Ali Saip Bey", "Şahin Bey"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "II. İnönü Muharebesi'nin kazanılması üzerine Anadolu'daki işgal birliklerini çekmeye başlayan ilk İtilaf devleti hangisidir?", options: ["İtalya", "Fransa", "İngiltere", "Yunanistan"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Lozan Barış Konferansı'nda kapitülasyonların kesin olarak kaldırılması Türkiye'nin en çok hangi alandaki bağımsızlığını güçlendirmiştir?", options: ["Ekonomik ve mali bağımsızlık", "Sadece askeri savunma", "Sadece deniz taşımacılığı", "Dini işler"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1926 yılında kabul edilen Türk Medeni Kanunu hangi ülkenin medeni kanunu örnek alınarak hazırlanmıştır?", options: ["İsviçre", "İtalya", "Almanya", "Fransa"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1934 yılında kabul edilen Soyadı Kanunu ile unvan ve lakapların yasaklanması doğrudan hangi Atatürk ilkesiyle ilgilidir?", options: ["Halkçılık", "Devletçilik", "Laiklik", "Cumhuriyetçilik"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Çağdaş Türk ve Dünya (3)
  { q: "Kafkasya'da Rus yayılmacılığına karşı bağımsızlık savaşı veren ve 'Kafkas Kartalı' olarak anılan Dağıstanlı lider kimdir?", options: ["Şeyh Şamil", "Gaspıralı İsmail", "Zeki Velidi Togan", "Mehmet Emin Resulzade"], answer: 0, tag: "Tarih" },
  { q: "İkinci Dünya Savaşı sonrasında ABD tarafından komünizm tehdidi altındaki Türkiye ve Yunanistan'a yapılan askeri yardım doktrini hangisidir?", options: ["Truman Doktrini", "Marshall Planı", "Eisenhower Doktrini", "Monroe Doktrini"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Azerbaycan'ın bağımsızlığını ilan eden ve 'Bir kere yükselen bayrak bir daha inmez' sözüyle tarihe geçen milli lider kimdir?", options: ["Mehmet Emin Resulzade", "Ebulfez Elçibey", "Haydar Aliyev", "Ayaz Mutallibov"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // ==================== COĞRAFYA (30 SORU) ====================
  // Coğrafi Konum & Fiziki (6)
  { q: "Türkiye'de gölge boyunun hiçbir zaman sıfır olmamasının matematiksel nedeni nedir?", options: ["Dönencelerin kuzeyinde yer alması (Yengeç dönencesi dışı)", "Başlangıç meridyeninin doğusunda olması", "Yükseltinin fazla olması", "Karasallık şiddeti"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "21 Mart ve 23 Eylül ekinoks tarihlerinde Türkiye'de görülen ortak coğrafi durum hangisidir?", options: ["Gece ve gündüz süresinin eşit olması (12 saat)", "En uzun gündüzün yaşanması", "Gölge boyunun en kısa olması", "Yıllık sıcaklık farkının sıfırlanması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye arazisinin ortalama yükseltisinin (1132 metre) fazla olmasında hangi jeolojik kuvvet etkili olmuştur?", options: ["Toptan yükselme (Epirojenez)", "Buzul birikimi", "Rüzgar aşınımı", "Kalker erimesi"], answer: 0, tag: "Coğrafya" },
  { q: "Marmara Bölgesi'nde hidroelektrik enerji potansiyelinin Türkiye genelinde en düşük olmasının temel sebebi nedir?", options: ["Yükseltinin ve akarsu yatak eğimlerinin az olması", "Yağışın hiç düşmemesi", "Akarsuların bulunmaması", "Göllerin sığ olması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akarsuların denize döküldüğü yerde gelgit genliği fazla ise hangi kıyı birikim şekli OLUŞAMAZ?", options: ["Delta Ovası", "Haliç", "Falez", "Kıyı Oku"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de tektonik hareketlerle oluşan dağların büyük kısmı hangi orojenez kuşağında yer alır?", options: ["Alp-Himalaya Kıvrım Kuşağı", "Kaledonyen Kuşağı", "Hüron Kuşağı", "Hersinyen Kuşağı"], answer: 0, tag: "Coğrafya" },

  // İklim & Bitki Örtüsü (5)
  { q: "Doğu Karadeniz Bölümü'nün Batı Karadeniz'e göre daha fazla yağış almasının temel fiziki sebebi nedir?", options: ["Kaçkar Dağları'nın kıyıya çok yakın ve daha yüksek olması", "Enleminin daha güneyde olması", "Deniz suyunun daha tuzlu olması", "Buharlaşmanın daha fazla olması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kış mevsiminde Sibirya'dan esen ve Doğu Karadeniz ile Doğu Anadolu'da dondurucu soğuklar getiren rüzgar hangisidir?", options: ["Poyraz", "Lodos", "Kıble", "Samyeli"], answer: 0, tag: "Coğrafya" },
  { q: "İç Anadolu Bölgesi'nde yer alan ormanların tahrip edilmesi sonucunda ortaya çıkan bozkırlara ne ad verilir?", options: ["Antropojen Bozkır", "Garig", "Psödomaki", "Alpin Çayır"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akdeniz kıyılarında zeytin, defne, mersin ve zakkum gibi bitkilerin doğal yetişme alanı bulması hangi iklimin kanıtıdır?", options: ["Akdeniz İklimi", "Karasal İklim", "Okyanusal İklim", "Tundra İklimi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de yıllık sıcaklık farkının en düşük olduğu yer neresidir?", options: ["Rize ve Doğu Karadeniz kıyı kuşağı", "Şanlıurfa", "Kars", "Konya"], answer: 0, tag: "Coğrafya" },

  // Yer Şekilleri, Su & Toprak (6)
  { q: "Rüzgârların taşıdığı ince toz ve kil materyallerini çukur alanlarda biriktirmesiyle oluşan lös topraklarına en çok nerede rastlanır?", options: ["İç Anadolu ve Güneydoğu Anadolu", "Doğu Karadeniz", "Batı Karadeniz", "Menteşe Yöresi"], answer: 0, tag: "Coğrafya" },
  { q: "Samsun ilinde Kızılırmak ve Yeşilırmak nehirlerinin oluşturduğu verimli delta ovaları sırasıyla hangileridir?", options: ["Bafra ve Çarşamba Ovaları", "Çukurova ve Silifke", "Menemen ve Balat", "Dikili ve Bakırçay"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kalker tabakalarının yer altında erimesiyle oluşan boşlukların tavanlarının çökmesi sonucu suyla dolan göllere ne ad verilir?", options: ["Karstik Göller", "Volkanik Göller", "Buzul Gölleri", "Kıyı Set Gölleri"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de kaynağını ülke dışından alıp topraklarımızdan denize dökülen akarsular hangileridir?", options: ["Meriç ve Asi Nehirleri", "Fırat ve Dicle", "Kura ve Aras", "Çoruh ve Zap"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Nüfus & Yerleşme (4)

// 1. Şıkları Karıştır
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soruları Rastgele Harmanla
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, correctCount: 0, streak: 0, answer: null, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.correctCount += 1;
      p.streak += 1;

      // Taban Puan: 100
      let gained = 100;
      if (p.streak >= 10) gained += 50;
      else if (p.streak >= 3) gained += 25;

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      correctCount: p.correctCount,
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniye Skor Tablosu
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'KPSS ÇIKMIŞ') tagElem.className = 'cat-badge cat-cikmis';
    else if (data.tag === 'Güncel') tagElem.className = 'cat-badge cat-guncel';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    
    // Yanlış yapanın yanında eşek emojisi (🫏) + Doğru Sayısı
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 3 ? `🔥x${p.streak}` : '✅') : '🫏';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan <small style="color:#94a3b8; margin-left:8px;">(${p.correctCount} Doğru)</small></span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 70 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
