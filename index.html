<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS Tarih & Coğrafya Karışık Yarışma</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-cikmis { background: #dc2626; color: #fee2e2; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS GY-GK Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 20 Coğrafya (Karışık & Çıkmış Sorular)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/50</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-tarih-cografya-50-v1";

const questions = [
  // --- TARİH: ÇIKMIŞ KPSS VE ÖZGÜN SORULAR (30 Soru) ---

  { q: "Kapıkulu ocaklarına asker yetiştirmek amacıyla I. Murad döneminde kurulan ilk askeri kışla hangisidir?", options: ["Acemi Ocağı", "Yeniçeri Ocağı", "Cebeci Ocağı", "Topçu Ocağı"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı minyatür sanatçılarına verilen unvan aşağıdakilerden hangisidir?", options: ["Nakkaş", "Hattat", "Müzehhib", "Hakkak"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Divan-ı Hümayun'da sadrazam sefere çıktığında başkentte yerine vekalet eden devlet adamı kimdir?", options: ["Sadaret Kaymakamı", "Kazasker", "Nişancı", "Kaptan-ı Derya"], answer: 0, tag: "Tarih" },
  { q: "Türk tarihinde ilk kez kendi adına para bastıran Türk hükümdarı kimdir?", options: ["Baga Tarkan (Türgişler)", "Mete Han", "Bumin Kağan", "Kutluk Kağan"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // --- COĞRAFYA: ÇIKMIŞ KPSS VE ÖZGÜN SORULAR (20 Soru) ---
  { q: "Türkiye'de doğu ile batı arasındaki yerel saat farkı kaç dakikadır?", options: ["76 Dakika", "60 Dakika", "44 Dakika", "82 Dakika"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Aşağıdaki göllerden hangisi bir karstik oluşumlu göl özelliği taşır?", options: ["Salda Gölü", "Van Gölü", "Terkos (Durusu)", "Çıldır Gölü"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'nin en büyük delta ovası olan Çukurova'yı oluşturan akarsular hangileridir?", options: ["Seyhan ve Ceyhan", "Kızılırmak ve Yeşilırmak", "Gediz ve Bakırçay", "Fırat ve Dicle"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de güneş ışınlarının hiçbir zaman dik açıyla (90 derece) düşmemesinin temel sebebi nedir?", options: ["Dönencelerin dışında yer alması (Matematik Konum)", "Yükseltinin batıdan doğuya artması", "Etrafının denizlerle çevrili olması", "Dağların doğu-batı uzanması"], answer: 0, tag: "Coğrafya" },
  { q: "Karadeniz ve Akdeniz'de dağların kıyıya paralel uzanmasının doğal bir sonucu olarak hangi kıyı tipi görülür?", options: ["Boyuna Kıyı Tipi", "Enine Kıyı Tipi", "Ria Kıyı Tipi", "Dalmaçya Kıyı Tipi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Antalya Kaş kıyılarında adaların kıyıya paralel dizilmesiyle oluşan özel kıyı tipi hangisidir?", options: ["Dalmaçya Kıyı Tipi", "Ria Kıyı Tipi", "Boyuna Kıyı", "Kalanklı Kıyı"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de rüzgar erozyonunun en şiddetli hissedildiği coğrafi bölge hangisidir?", options: ["İç Anadolu Bölgesi", "Karadeniz Bölgesi", "Doğu Anadolu Bölgesi", "Ege Bölgesi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Aşağıdaki ovalardan hangisi bir fay hattı çöküntüsü üzerinde oluşmuş 'tektonik' kökenli ovadır?", options: ["Erbaa Ovası", "Çarşamba Ovası", "Silifke Ovası", "Bafra Ovası"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de volkanik patlama sonucu oluşan gaz patlaması çukurlarına (Maar) en bilinen örnek hangisidir?", options: ["Meke Tuzlası (Meke Maar Gölü)", "Nemrut Krater Gölü", "Uzungöl", "Tortum Gölü"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akdeniz iklim bölgesinde kalkerli araziler üzerinde oluşan kırmızı renkli karakteristik toprak türü hangisidir?", options: ["Terra Rossa", "Çernezyom", "Podzol", "Laterit"], answer: 0, tag: "Coğrafya" },
  { q: "Erzurum-Kars platosunda çayır bitki örtüsü altında gelişen, dünyanın en verimli yerli toprağı sayılan toprak hangisidir?", options: ["Çernezyom (Kara Toprak)", "Kahverengi Bozkır", "Alüvyal Toprak", "Regosol"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de nemlilik ve yağış rejiminin en düzenli olduğu, dolayısıyla yıllık sıcaklık farkının en az olduğu bölge hangisidir?", options: ["Doğu Karadeniz Kıyıları", "Güneydoğu Anadolu", "İç Batı Anadolu", "Ergene Bölümü"], answer: 0, tag: "Coğrafya" },
  { q: "Akdeniz kıyılarında makilerin tahrip edilmesiyle ortaya çıkan kısa boylu bodur çalı topluluğuna ne ad verilir?", options: ["Garig (Frigana)", "Psödomaki", "Bozkır", "Antropojen Bozkır"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  { q: "Türkiye'de demir-çelik sanayisinin Karabük ve İskenderun'da kurulmasında sırasıyla hangi faktörler etkili olmuştur?", options: ["Enerji kaynağına yakınlık - Ulaşım (Liman)", "Hammaddeye yakınlık - Pazar", "İklim şartları - İş gücü", "Su kaynakları - Sermaye"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de petrolün ilk kez çıkarıldığı ve rafinerisi bulunan Güneydoğu Anadolu Dağı hangisidir?", options: ["Raman Dağı", "Cudi Dağı", "Gabar Dağı", "Karacadağ"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'nin elektrik üretiminde jeotermal enerjiden yararlandığı ilk santral hangi ilimizdedir?", options: ["Denizli (Sarayköy)", "Manisa (Alaşehir)", "Aydın (Germencik)", "İzmir (Balçova)"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Rize ve çevresinde turunçgil ve çay tarımının yapılabilmesini sağlayan mikroklima alanı oluşturan yerel rüzgar hangisidir?", options: ["Föhn Rüzgarı", "Poyraz", "Lodos", "Karayel"], answer: 0, tag: "Coğrafya" }
];

// 1. Şık Karıştırma: Her sorunun doğru cevabını rastgele şıklara dağıt
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soru Sıralaması Karıştırma: Tarih ve Coğrafyayı tamamen harmanla
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, streak: 0, answer: null, answerTime: 0 });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, streak: 0, answer: null, answerTime: 0 });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      p.answerTime = data.timeRemaining;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.answerTime = 0; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;
  const currentLeaderScore = Math.max(...players.map(p => p.score), 0);

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.streak += 1;
      let gained = 300 + (p.answerTime * 20);

      if (p.streak >= 3) gained += 100;
      else if (p.streak === 2) gained += 50;

      // COMEBACK MEKANİZMASI
      const deficit = currentLeaderScore - p.score;
      if (deficit >= 1500) {
        gained = Math.round(gained * 1.4);
      } else if (deficit >= 800) {
        gained = Math.round(gained * 1.25);
      }

      p.score += gained;
    } else {
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ name: p.name, score: p.score, streak: p.streak })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniye Skor Tablosu
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    // Etiket yönetimi
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'KPSS ÇIKMIŞ') tagElem.className = 'cat-badge cat-cikmis';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = data.leaderboard.map((p, i) => `
      <div class="leaderboard-row">
        <span>#${i + 1} ${p.name} ${p.streak >= 2 ? '🔥' + p.streak : ''}</span>
        <span style="color:#38bdf8;">${p.score} Puan</span>
      </div>
    `).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 50 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx, timeRemaining: timeLeft };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; me.answerTime = timeLeft; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
