<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KPSS 60 Soru (Sıfır Tekrar - Karışık)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1329; color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 680px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
    input { width: 100%; padding: 14px; background: #0f172a; border: 2px solid #334155; color: #fff; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .timer-container { width: 100%; background: #334155; border-radius: 8px; height: 12px; margin: 15px 0; overflow: hidden; }
    .timer-bar { height: 100%; width: 100%; background: #38bdf8; transition: width 0.9s linear; }
    .option-btn { width: 100%; text-align: left; background: #334155; color: #f8fafc; border: 2px solid #475569; padding: 14px; border-radius: 10px; margin: 10px 0; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .option-btn:hover:not(:disabled) { background: #475569; border-color: #94a3b8; }
    .option-btn.selected { border-color: #38bdf8; background: #1e3a8a; }
    .badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #94a3b8; border: 1px solid #334155; }
    .player-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; display: inline-block; font-size: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; font-weight: 600; }
    .cat-badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-left: 6px; }
    .cat-cikmis { background: #dc2626; color: #fee2e2; }
    .cat-tarih { background: #2563eb; color: #dbeafe; }
    .cat-cografya { background: #059669; color: #d1fae5; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-card" class="card">
    <h2>KPSS GY-GK Maratonu</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px;">30 Tarih + 30 Coğrafya (Sıfır Tekrar - Karışık Soru Düzeni)</p>
    <input type="text" id="my-name" placeholder="Yarışmacı Adınızı Yazın..." maxlength="15">
    <button class="btn" onclick="enterGame()">Lobiye Katıl</button>
  </div>

  <!-- BEKLEME LOBİSİ -->
  <div id="lobby-card" class="card" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
      <h3 style="margin:0;">Yarışma Odası</h3>
      <span class="badge" id="player-count">0 Oyuncu</span>
    </div>
    <p style="color: #94a3b8; font-size: 14px;">Katılan oyuncular:</p>
    <div id="lobby-players" style="min-height: 80px; margin-bottom: 20px;"></div>
    
    <div id="host-actions" style="display: none;">
      <button class="btn" style="background:#10b981;" onclick="startQuiz()">Yarışmayı Başlat</button>
    </div>
    <p id="wait-msg" style="text-align:center; color:#94a3b8; font-size: 14px;">Oda kurucusunun oyunu başlatması bekleniyor...</p>
  </div>

  <!-- SORU EKRANI -->
  <div id="quiz-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="badge" id="q-counter">Soru 1/60</span>
        <span id="q-cat" class="cat-badge">KPSS</span>
      </div>
      <span class="badge" id="time-text" style="color: #f59e0b;">20s</span>
    </div>

    <div class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <h3 id="question-text" style="text-align: left; font-size: 17px; min-height: 48px; color: #f8fafc; line-height: 1.5;"></h3>
    <div id="options-container"></div>
    
    <div id="status-footer" style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; min-height: 22px;"></div>
  </div>

  <!-- 5 SANİYELİK SKOR EKRANI -->
  <div id="round-card" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="round-result-title" style="margin:0;">Tur Bitti</h3>
      <span class="badge" style="color: #38bdf8;">Sonraki soruya geçiliyor (5s)...</span>
    </div>
    <p id="round-correct-ans" style="text-align:center; color:#4ade80; font-weight:600; font-size: 17px; margin: 15px 0;"></p>
    <div id="leaderboard" style="margin: 15px 0;"></div>
  </div>

<script>
const ROOM_NAME = "kpss-60-tarih-cografya-v2";

const questions = [
  // ==================== TARİH (30 ÖZGÜN SORU) ====================
  // İslamiyet Öncesi (4)
  { q: "Eski Türklerde hükümdarın tahta otururken giydiği kemere ve kuşandığı kuşağa ne ad verilirdi?", options: ["Kur (Kemer)", "Kotuz", "Örgün", "Kama"], answer: 0, tag: "Tarih" },
  { q: "Çin kaynaklarında 'Gök Tengri'nin oğlu' veya 'Büyük Kağan' anlamına gelen 'Şanyü' unvanını kullanan ilk Türk topluluğu hangisidir?", options: ["Asya Hunları", "Avarlar", "Karluklar", "Uygurlar"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İslamiyet öncesi Türk devletlerinde adli yargılamada 'adi suçlara ve örfi davalara' bakan yerel yargıca ne ad verilirdi?", options: ["Yarguçı", "Tudun", "Bitikçi", "Ayguçı"], answer: 0, tag: "Tarih" },
  { q: "Bizans'a elçi gönderen Maniakh adlı Soğdlu tüccar, hangi Türk devleti adına diplomatik elçilik görevini yürütmüştür?", options: ["Göktürkler", "Hazarlar", "Avarlar", "Türgişler"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // İlk Türk-İslam (4)
  { q: "Karahanlılar Devleti'nde posta ve gizli istihbarat işlerini yürüten teşkilat hangisidir?", options: ["Berid Teşkilatı", "İşraf Teşkilatı", "İnşa Teşkilatı", "Mezalim"], answer: 0, tag: "Tarih" },
  { q: "Anadolu'da kurulan ilk Türk beyliklerinden Çaka Beyliği'nin 1081'de donanma kurması günümüzde hangi askeri birimin kuruluş yılı kabul edilir?", options: ["Türk Deniz Kuvvetleri", "Türk Kara Kuvvetleri", "Sahil Güvenlik Komutanlığı", "Hava Kuvvetleri"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1187 Hıttin Savaşı ile Haçlıları mağlup ederek Kudüs'ü geri alan Eyyubi hükümdarı kimdir?", options: ["Selahaddin Eyyubi", "Nureddin Zengi", "Baybars", "Kutuz"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Anadolu Selçuklularında kervansaraylarda konaklayan yolcuların ilk üç gün ücretsiz barınması hangi anlayışın ürünüdür?", options: ["Sosyal devlet anlayışı", "Teokratik yönetim", "Merkeziyetçi yapı", "Tımarlı ordu teşkilatı"], answer: 0, tag: "Tarih" },

  // Osmanlı Siyasi & Kültür (10)
  { q: "Osmanlı Devleti'nde Rumeli Beylerbeyliği ilk kez hangi padişah döneminde kurulmuştur?", options: ["I. Murad", "Orhan Bey", "Yıldırım Bayezid", "Fatih Sultan Mehmet"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "İtalyan ressam Gentile Bellini'yi İstanbul'a davet ederek kendi portresini ve madalyonunu yaptıran Osmanlı padişahı kimdir?", options: ["Fatih Sultan Mehmet", "Kanuni Sultan Süleyman", "II. Bayezid", "III. Ahmed"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı sarayında padişahın resmi görüşmelerini yaptığı ve elçileri kabul ettiği kabul salonuna ne ad verilir?", options: ["Arz Odası", "Kubbealtı", "Revan Köşkü", "Has Oda"], answer: 0, tag: "Tarih" },
  { q: "1538 Preveze Deniz Savaşı'nda Haçlı donanmasının başında yer alan Cenevizli amiral kimdir?", options: ["Andrea Doria", "Don Juan", "Mocenigo", "Saint Jean"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı ordusunda sınır boylarında görev yapan ve ordunun önünde giderek keşif yapan atlı akıncılara ne ad verilirdi?", options: ["Deliler ve Akıncılar", "Humbaracılar", "Cebeciler", "Turnacılar"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde padişahın sefere bizzat çıkmadığı durumlarda orduya komutanlık eden sadrazama hangi unvan verilirdi?", options: ["Serdar-ı Ekrem", "Kaptan-ı Derya", "Beylerbeyi", "Veziriazam Kethüdası"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Osmanlı'da lonca üyesi esnaflar arasında dayanışmayı sağlayan ve ihtiyaç sahiplerine faizsiz kredi veren sandığa ne ad verilir?", options: ["Orta Sandığı (Teavün Sandığı)", "Esham", "Mukataa Sandığı", "İrad-ı Cedit"], answer: 0, tag: "Tarih" },
  { q: "III. Selim döneminde Kabakçı Mustafa İsyanı ile tahttan indirilmesi sonrası yerine geçen padişah kimdir?", options: ["IV. Mustafa", "II. Mahmud", "III. Osman", "I. Abdülhamid"], answer: 0, tag: "Tarih" },
  { q: "Osmanlı Devleti'nde ilk kez resmi bir posta nezaretinin (Posta Teşkilatı) kurulması hangi padişah dönemine aittir?", options: ["II. Mahmud", "Abdülmecid", "III. Selim", "II. Abdülhamid"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1876 Kanun-ı Esasi'ye göre padişah tarafından ömür boyu görevde kalmak üzere atanan meclis kanadı hangisidir?", options: ["Heyet-i Ayan", "Heyet-i Mebusan", "Divan-ı Ahkam-ı Adliye", "Şura-yı Devlet"], answer: 0, tag: "Tarih" },

  // Milli Mücadele & İnkılap (9)
  { q: "I. Balkan Savaşı yenilgisinden sonra İttihat ve Terakki Cemiyeti'nin hükümeti devirip yönetimi ele geçirdiği darbe hangisidir?", options: ["Babıali Baskını", "31 Mart Vakası", "Kuleli Vakası", "Çırağan Baskını"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "I. Dünya Savaşı'nda İngilizlerle anlaşarak Hicaz'da Osmanlı'ya karşı ayaklanan Mekke Emiri kimdir?", options: ["Şerif Hüseyin", "İbn Suud", "Faysal", "Yahya"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Milli Mücadele Dönemi'nde işgallere karşı basın ve yayın yoluyla ilk direniş bildirisini yayımlayan cemiyet hangisidir?", options: ["Milli Kongre Cemiyeti", "Karakol Cemiyeti", "Kilikyalılar Cemiyeti", "Trakya-Paşaeli Cemiyeti"], answer: 0, tag: "Tarih" },
  { q: "Amasya Genelgesi metnini Mustafa Kemal Paşa'nın yaveri olarak kaleme alan subay kimdir?", options: ["Cevat Abbas (Gürer)", "Salih Bozok", "Kılıç Ali", "Ruşen Eşref"], answer: 0, tag: "Tarih" },
  { q: "Erzurum Kongresi'nde Temsil Heyeti başkanlığına seçilen kişi kimdir?", options: ["Mustafa Kemal Paşa", "Kazım Karabekir", "Rauf Orbay", "Refet Bele"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "I. TBMM'nin çıkardığı ilk vergi kanunu aşağıdakilerden hangisidir?", options: ["Ağnam Resmi Kanunu", "Gümrük Kanunu", "Aşar Vergisi Kanunu", "Varlık Vergisi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Mudanya Mütarekesi sonrasında Doğu Trakya'yı TBMM adına teslim almakla görevlendirilen komutan kimdir?", options: ["Refet Bele", "İsmet İnönü", "Fevzi Çakmak", "Ali Fuat Cebesoy"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "1925 yılında Aşar vergisinin kaldırılması doğrudan hangi Atatürk ilkesi doğrultusunda köylüyü rahatlatmayı amaçlamıştır?", options: ["Halkçılık", "Devletçilik", "Laiklik", "Cumhuriyetçilik"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye Cumhuriyeti'nde madencilik faaliyetlerini finanse etmek ve yer altı kaynaklarını işletmek amacıyla 1935'te kurulan banka hangisidir?", options: ["Etibank", "Sümerbank", "Denizbank", "İller Bankası"], answer: 0, tag: "Tarih" },

  // Çağdaş Türk ve Dünya (3)
  { q: "İkinci Dünya Savaşı yıllarında Cumhurbaşkanı İsmet İnönü ile İngiltere Başbakanı Churchill arasında tren vagonunda yapılan görüşme hangisidir?", options: ["Yenice (Adana) Görüşmesi", "Kahire Konferansı", "Tahran Konferansı", "Kazablanka Görüşmesi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Soğuk Savaş döneminde SSCB öncülüğünde Doğu Bloku ülkeleri arasında askeri savunma paktı olarak kurulan örgüt hangisidir?", options: ["Varşova Paktı", "NATO", "SEATO", "Bağdat Paktı"], answer: 0, tag: "Tarih" },
  { q: "Hindistan'ın bağımsızlık mücadelesinde şiddet karşıtı sivil itaatsizlik yöntemini savunan lider kimdir?", options: ["Mahatma Gandhi", "Muhammed Ali Cinnah", "Javaharlal Nehru", "Cevdet Rıdvan"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // ==================== COĞRAFYA (30 ÖZGÜN SORU) ====================
  // Coğrafi Konum & Fiziki (6)
  { q: "Türkiye'nin aynı boylam üzerinde bulunan iki merkezinde yıl boyunca kesinlikle aynı olan durum hangisidir?", options: ["Öğle vakti ve yerel saat", "Güneşin doğuş ve batış saati", "Gündüz süresi", "Gölge boyu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de güneyden esen Lodos ve Kıble gibi yerel rüzgarların sıcaklığı yükseltmesi hangi konum özelliğinin sonucudur?", options: ["Kuzey Yarım Küre'de yer almasının (Enlem)", "Doğu Yarım Küre'de olmasının", "Dağların kıyıya uzanışının", "Yükseltinin"], answer: 0, tag: "Coğrafya" },
  { q: "Türkiye'de buzul aşınım ve birikim şekillerine sadece yüksek dağ zirvelerinde rastlanmasının temel sebebi nedir?", options: ["Orta kuşakta yer alması ve matematik konumu", "Nem oranının yüksekliği", "Üç tarafının denizlerle çevrili olması", "Genç oluşumlu arazi olması"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Akdeniz kıyılarında deniz derinliğinin (kıta sahanlığının) hemen derinleşmesi neyin doğal sonucudur?", options: ["Falezlerin (yalıyar) yaygın olmasının", "Geniş kumsalların oluşmasının", "Delta ovalarının çokluğunun", "Lagünlerin yaygınlığının"], answer: 0, tag: "Coğrafya" },
  { q: "Dalga ve akıntıların taşıdığı kumların bir adayı karaya bağlamasıyla oluşan saplı ada (Tombolo) yapısına en tipik örnek hangisidir?", options: ["Kapıdağ Yarımadası ve Sinop İnceburun", "Çeşme Yarımadası", "Datça Yarımadası", "Gelibolu Yarımadası"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Aşağıdaki göllerden hangisi lav akıntılarının bir vadinin önünü kapatmasıyla oluşan volkanik set gölüdür?", options: ["Çıldır Gölü", "Beyşehir Gölü", "Eğirdir Gölü", "Manyas Gölü"], answer: 0, tag: "Coğrafya" },

  // İklim & Bitki Örtüsü (5)
  { q: "Türkiye'de yıllık toplam yağış miktarının en az olduğu, etrafı dağlarla çevrili çukur ova hangisidir?", options: ["Iğdır Ovası", "Konya Ovası", "Ergene Ovası", "Malatya Ovası"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Kuzeydoğu Anadolu'da (Erzurum-Kars) en fazla yağışın yaz aylarında düşmesi hangi bitki örtüsünün gelişmesini sağlamıştır?", options: ["Alpin Çayırlar (Büyükbaş mera)", "Kısa bozkır", "Garig toplulukları", "Maki"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Dünyada yalnızca belirli bir dar coğrafi alanda yetişen bitkilere ne ad verilir?", options: ["Endemik Bitki", "Relikt (Kalıntı) Bitki", "Psödomaki", "Klimaks Bitki"], answer: 0, tag: "Coğrafya" },
  { q: "Köroğlu Dağları ve Ilgaz Dağları'nda nemli ve soğuk iklim koşullarında yetişen iğne yapraklı karakteristik ağaç türü hangisidir?", options: ["Sarıçam ve Göknar", "Kızılçam", "Fıstık Çamı", "Zeytin"], answer: 0, tag: "Coğrafya" },
  { q: "Güneydoğu Anadolu Bölgesi'nde yaz sıcaklıklarının Akdeniz kıyılarından daha yüksek olmasını sağlayan temel faktörler hangileridir?", options: ["Karasallık ve güneyden gelen Basra alçak basıncı", "Yükseltinin fazlalığı", "Enlemin etkisi", "Orman örtüsünün sıklığı"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Yer Şekilleri, Su & Toprak (6)
  { q: "Karstik arazilerde erime sonucu oluşan en küçük karstik çukurluk hangisidir?", options: ["Lapya", "Dolin", "Uvala", "Polye"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de rüzgâr aşındırması sonucu oluşan, mantar görünümlü kayaçlara (Mantar Kaya / Şeytan Masası) en sık nerede rastlanır?", options: ["İç Anadolu ve Nevşehir çevresi", "Doğu Karadeniz", "Batı Karadeniz", "Menteşe Yöresi"], answer: 0, tag: "Coğrafya" },
  { q: "Lav örtüsü altında kalmış tabakaların akarsularla yarılmasıyla oluşan 'volkanik plato' hangisidir?", options: ["Erzurum-Kars Platosu", "Haymana Platosu", "Obruk Platosu", "Cihanbeyli Platosu"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Suların kireçli araziden sızarken kalsiyum karbonatın çökelmesiyle oluşan Pamukkale basamakları hangi yer şeklidir?", options: ["Traverten", "Sütdişi", "Sarkıt-Dikit", "Obruk"], answer: 0, tag: "Coğrafya" },
  { q: "Akarsuların taşıdığı mineralce zengin alüvyonları biriktirmesiyle oluşan, katmanlaşma göstermeyen azonal toprak türü hangisidir?", options: ["Alüvyal Toprak", "Kahverengi Orman", "Podzol", "Tundra"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de debisi en yüksek olan ve enerji potansiyeli en zengin akarsu hangisidir?", options: ["Fırat Nehri", "Kızılırmak", "Sakarya Nehri", "Meriç Nehri"], answer: 0, tag: "Coğrafya" },

  // Nüfus & Yerleşme (4)
  { q: "Menteşe Yöresi'nin (Muğla ve çevresi) bol yağış almasına rağmen seyrek nüfuslu olmasının temel sebebi nedir?", options: ["Arazinin aşırı dağlık, engebeli ve karstik olması", "İklimin aşırı soğuk olması", "Tarım alanlarının verimsizliği", "Sanayinin gelişmemesi"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de kırsal kesimde taş meskenlerin (taş evlerin) en yaygın olarak görüldüğü coğrafi bölge hangisidir?", options: ["Akdeniz ve Güneydoğu Anadolu (Kalker ve Bazalt arazisi)", "Doğu Karadeniz", "Batı Karadeniz", "Trakya"], answer: 0, tag: "Coğrafya" },
  { q: "Batı Karadeniz kırsalında birkaç ailenin bir araya gelmesiyle oluşan sürekli köy altı yerleşmesi hangisidir?", options: ["Divan", "Ağıl", "Yayla", "Dalyan"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de mevsimlik işçi göçünün yaz aylarında Ordu ve Giresun yöresine yoğunlaşmasının sebebi hangi tarım ürünüdür?", options: ["Fındık Hasadı", "Pamuk Toplama", "Çay Hasadı", "Tütün Kırımı"], answer: 0, tag: "Coğrafya" },

  // Tarım & Hayvancılık (4)
  { q: "Üretimi devlet kontrolünde olan ve uyuşturucu hammaddesi içerdiği için izne tabi yetiştirilen tarım ürünü hangisidir?", options: ["Haşhaş", "Tütün", "Şeker Pancarı", "Çeltik (Pirinç)"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Sivrisinek üremesine ve sıtma hastalığına yol açtığı için yerleşim yerlerinin yakınına ekimi yasak olan ürün hangisidir?", options: ["Çeltik (Pirinç)", "Pamuk", "Soya Fasulyesi", "Mısır"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de arıcılık ve bal üretiminin en gelişmiş olduğu Muğla ve Doğu Karadeniz'de etkili olan temel doğal faktör nedir?", options: ["Zengin bitki örtüsü ve dağlık florası", "Gelişmiş tarım teknolojisi", "Geniş sulak alanlar", "Ilıman kış mevsimi"], answer: 0, tag: "Coğrafya" },
  { q: "İç Anadolu ve Güneydoğu'da bozkır bitki örtüsünün yaygın olması doğrudan hangi hayvancılık kolunu ön plana çıkarmıştır?", options: ["Küçükbaş Hayvancılık (Koyun yetiştiriciliği)", "Büyükbaş Besi Hayvancılığı", "İpek Böcekçiliği", "Balıkçılık"], answer: 0, tag: "KPSS ÇIKMIŞ" },

  // Madenler, Enerji & Sanayi (5)
  { q: "Demirin çeliğe dönüştürülmesinde sertleştirici olarak kullanılan ve Fethiye, Elazığ Guleman'da çıkarılan maden hangisidir?", options: ["Krom", "Bakır", "Kurşun", "Cıva"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Doğalgaz rezervi bulunan ve Kırklareli Hamitabat ile Mardin Çamurlu'da çıkarılan hidrokarbon kaynağı hangisidir?", options: ["Doğalgaz", "Taş Kömürü", "Asfaltit", "Petrol"], answer: 0, tag: "Coğrafya" },
  { q: "Güneydoğu Anadolu'da Şırnak ve Silopi yöresinde çıkarılan katı petrol türevi enerji kaynağı hangisidir?", options: ["Asfaltit", "Linyit", "Antrasit", "Turba"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Türkiye'de hinterlandı çok dar olduğu ve demiryolu bağlantısı bulunmadığı için gelişemeyen Karadeniz limanı hangisidir?", options: ["Sinop Limanı", "Samsun Limanı", "Trabzon Limanı", "Zonguldak Limanı"], answer: 0, tag: "KPSS ÇIKMIŞ" },
  { q: "Mersin'de Akdeniz kıyısında inşası devam eden Türkiye'nin ilk nükleer enerji santrali projesi hangisidir?", options: ["Akkuyu Nükleer Güç Santrali", "Sinop Nükleer Santrali", "İğneada Santrali", "Ceyhan Santrali"], answer: 0, tag: "Coğrafya" }
];

// 1. Şıkları Karıştır (Doğru seçenek rastgele dağılsın)
questions.forEach(qObj => {
  const correctText = qObj.options[qObj.answer];
  for (let i = qObj.options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qObj.options[i], qObj.options[j]] = [qObj.options[j], qObj.options[i]];
  }
  qObj.answer = qObj.options.indexOf(correctText);
});

// 2. Soruları Karıştır (Tarih ve Coğrafya rastgele harmanlansın)
for (let i = questions.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [questions[i], questions[j]] = [questions[j], questions[i]];
}

let peer = null;
let isHost = false;
let myName = "";
let myPeerId = "";
let hostConn = null;

let players = [];
let currentQ = -1;
let timer = null;
let timeLeft = 20;

function enterGame() {
  myName = document.getElementById('my-name').value.trim();
  if (!myName) return alert("Lütfen adınızı girin!");

  document.getElementById('login-card').style.display = 'none';
  document.getElementById('lobby-card').style.display = 'block';

  peer = new Peer(ROOM_NAME);

  peer.on('open', (id) => {
    isHost = true;
    myPeerId = id;
    players.push({ id: myPeerId, name: myName, score: 0, streak: 0, answer: null, answerTime: 0, wasCorrect: false });
    document.getElementById('host-actions').style.display = 'block';
    document.getElementById('wait-msg').style.display = 'none';
    renderLobby();

    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleHostData(conn, data));
      conn.on('close', () => {
        players = players.filter(p => p.id !== conn.peer);
        renderLobby();
        broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
      });
    });
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      isHost = false;
      joinAsClient();
    }
  });
}

function joinAsClient() {
  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    hostConn = peer.connect(ROOM_NAME);
    hostConn.on('open', () => {
      hostConn.send({ type: 'JOIN', name: myName });
    });
    hostConn.on('data', (data) => handleClientData(data));
  });
}

function handleHostData(conn, data) {
  if (data.type === 'JOIN') {
    players.push({ conn, id: conn.peer, name: data.name, score: 0, streak: 0, answer: null, answerTime: 0, wasCorrect: false });
    renderLobby();
    broadcast({ type: 'LOBBY_UPDATE', players: players.map(p => ({ name: p.name, score: p.score })) });
  } else if (data.type === 'SUBMIT_ANSWER') {
    const p = players.find(x => x.id === conn.peer);
    if (p && p.answer === null) {
      p.answer = data.choice;
      p.answerTime = data.timeRemaining;
      checkAllAnswered();
    }
  }
}

function broadcast(msg) {
  players.forEach(p => {
    if (p.conn && p.conn.open) p.conn.send(msg);
  });
}

function renderLobby() {
  document.getElementById('player-count').innerText = `${players.length} Oyuncu`;
  document.getElementById('lobby-players').innerHTML = players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
}

function startQuiz() {
  currentQ = -1;
  broadcast({ type: 'START' });
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    broadcast({ type: 'GAME_OVER' });
    handleClientData({ type: 'GAME_OVER' });
    return;
  }

  players.forEach(p => { p.answer = null; p.answerTime = 0; p.wasCorrect = false; });

  const q = questions[currentQ];
  const qData = {
    type: 'QUESTION',
    index: currentQ,
    total: questions.length,
    q: q.q,
    options: q.options,
    tag: q.tag
  };

  broadcast(qData);
  handleClientData(qData);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 20;
  timer = setInterval(() => {
    timeLeft--;
    broadcast({ type: 'TICK', timeLeft });
    handleClientData({ type: 'TICK', timeLeft });

    if (timeLeft <= 0) {
      clearInterval(timer);
      evaluateRound();
    }
  }, 1000);
}

function checkAllAnswered() {
  const allDone = players.every(p => p.answer !== null);
  if (allDone) {
    clearInterval(timer);
    evaluateRound();
  }
}

function evaluateRound() {
  const correctIdx = questions[currentQ].answer;
  const currentLeaderScore = Math.max(...players.map(p => p.score), 0);

  players.forEach(p => {
    if (p.answer === correctIdx) {
      p.wasCorrect = true;
      p.streak += 1;
      let gained = 300 + (p.answerTime * 20);

      if (p.streak >= 3) gained += 100;
      else if (p.streak === 2) gained += 50;

      // COMEBACK MEKANİZMASI
      const deficit = currentLeaderScore - p.score;
      if (deficit >= 1500) {
        gained = Math.round(gained * 1.4);
      } else if (deficit >= 800) {
        gained = Math.round(gained * 1.25);
      }

      p.score += gained;
    } else {
      p.wasCorrect = false;
      p.streak = 0;
    }
  });

  players.sort((a, b) => b.score - a.score);

  const resultData = {
    type: 'ROUND_OVER',
    correctAnswer: questions[currentQ].options[correctIdx],
    leaderboard: players.map(p => ({ 
      name: p.name, 
      score: p.score, 
      streak: p.streak,
      wasCorrect: p.wasCorrect 
    })),
    isLast: currentQ + 1 >= questions.length
  };

  broadcast(resultData);
  handleClientData(resultData);

  // 5 Saniyelik Bekleme
  if (!resultData.isLast) {
    setTimeout(() => {
      nextQuestion();
    }, 5000);
  } else {
    setTimeout(() => {
      broadcast({ type: 'GAME_OVER' });
      handleClientData({ type: 'GAME_OVER' });
    }, 5000);
  }
}

let selectedChoice = null;

function handleClientData(data) {
  if (data.type === 'LOBBY_UPDATE') {
    document.getElementById('player-count').innerText = `${data.players.length} Oyuncu`;
    document.getElementById('lobby-players').innerHTML = data.players.map(p => `<span class="player-chip">👤 ${p.name}</span>`).join('');
  } else if (data.type === 'START') {
    document.getElementById('lobby-card').style.display = 'none';
  } else if (data.type === 'QUESTION') {
    selectedChoice = null;
    document.getElementById('lobby-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    document.getElementById('q-counter').innerText = `Soru ${data.index + 1}/${data.total}`;
    
    const tagElem = document.getElementById('q-cat');
    tagElem.innerText = data.tag;
    if (data.tag === 'KPSS ÇIKMIŞ') tagElem.className = 'cat-badge cat-cikmis';
    else if (data.tag === 'Coğrafya') tagElem.className = 'cat-badge cat-cografya';
    else tagElem.className = 'cat-badge cat-tarih';

    document.getElementById('question-text').innerText = data.q;
    document.getElementById('status-footer').innerText = "Cevabınızı seçin...";
    document.getElementById('timer-bar').style.width = '100%';

    const optBox = document.getElementById('options-container');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
      b.onclick = () => submitAnswer(idx, b);
      optBox.appendChild(b);
    });
  } else if (data.type === 'TICK') {
    document.getElementById('time-text').innerText = `${data.timeLeft}s`;
    document.getElementById('timer-bar').style.width = `${(data.timeLeft / 20) * 100}%`;
  } else if (data.type === 'ROUND_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';

    document.getElementById('round-correct-ans').innerText = `Doğru Cevap: ${data.correctAnswer}`;
    const lb = document.getElementById('leaderboard');
    
    // Yanlış yapana eşek emojisi (🫏), bilene rozet
    lb.innerHTML = data.leaderboard.map((p, i) => {
      const statusIcon = p.wasCorrect ? (p.streak >= 2 ? `🔥x${p.streak}` : '✅') : '🫏';
      return `
        <div class="leaderboard-row">
          <span>#${i + 1} ${p.name} <span style="font-size: 18px; margin-left: 6px;">${statusIcon}</span></span>
          <span style="color:#38bdf8;">${p.score} Puan</span>
        </div>
      `;
    }).join('');
  } else if (data.type === 'GAME_OVER') {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('round-card').style.display = 'block';
    document.getElementById('round-result-title').innerText = "🏆 60 Soru Tamamlandı! 🏆";
    document.getElementById('round-correct-ans').innerText = "Yarışma sona erdi.";
  }
}

function submitAnswer(idx, btnElem) {
  if (selectedChoice !== null) return;
  selectedChoice = idx;

  btnElem.classList.add('selected');
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  document.getElementById('status-footer').innerText = "Cevabınız iletildi! Diğerleri bekleniyor...";

  const payload = { type: 'SUBMIT_ANSWER', choice: idx, timeRemaining: timeLeft };
  if (isHost) {
    const me = players.find(p => p.id === myPeerId);
    if (me) { me.answer = idx; me.answerTime = timeLeft; checkAllAnswered(); }
  } else if (hostConn) {
    hostConn.send(payload);
  }
}
</script>
